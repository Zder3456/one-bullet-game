let ac = null, master = null, sfxBus = null, musicBus = null, noiseBuf = null, arpSend = null;

const BPM = 96;
const STEP16 = 60 / BPM / 4;
const CHORDS = [

  [41, 45, 48, 53, 57, 60],

];

function hz(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }

function ensureAudio() {
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -16;
      comp.knee.value = 12;
      comp.ratio.value = 5;
      comp.attack.value = 0.004;
      comp.release.value = 0.25;
      master = ac.createGain();
      master.gain.value = (S.volume / 100) * 0.55;
      sfxBus = ac.createGain();
      sfxBus.gain.value = S.sfx / 100;
      musicBus = ac.createGain();
      musicBus.gain.value = (S.music / 100) * 0.3 * musicDuck;
      sfxBus.connect(master);
      musicBus.connect(master);
      master.connect(comp);
      comp.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.5), ac.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      arpSend = ac.createDelay(1);
      arpSend.delayTime.value = STEP16 * 3;
      const fb = ac.createGain();
      fb.gain.value = 0.24;
      const lp = ac.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 2000;
      arpSend.connect(fb);
      fb.connect(arpSend);
      arpSend.connect(lp);
      lp.connect(musicBus);
    } catch (e) { ac = null; }
  }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}

function applyVolume() {
  if (!ac) return;
  master.gain.value = (S.volume / 100) * 0.55;
  sfxBus.gain.value = S.sfx / 100;
  musicBus.gain.value = (S.music / 100) * 0.3 * musicDuck;
}

function setDuck(v) {
  musicDuck = v;
  if (ac && musicBus) {
    musicBus.gain.setTargetAtTime((S.music / 100) * 0.3 * v, ac.currentTime, 0.2);
  }
}

function tone(f0, f1, dur, type, vol, delay) {
  const a = ensureAudio();
  if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  const t = a.currentTime + (delay || 0);
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g);
  g.connect(sfxBus);
  o.start(t);
  o.stop(t + dur + 0.04);
}

function noiseAt(dur, vol, type, freq, q, t, dest) {
  if (!ac || !noiseBuf) return;
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf;
  f.type = type;
  f.frequency.value = freq;
  f.Q.value = q || 1;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f);
  f.connect(g);
  g.connect(dest || sfxBus);
  s.start(t);
  s.stop(t + dur + 0.02);
}

function noise(dur, vol, type, freq, q, delay, dest) {
  const a = ensureAudio();
  if (!a) return;
  noiseAt(dur, vol, type, freq, q, a.currentTime + (delay || 0), dest);
}

function musicNote(freq, t, dur, type, vol, cutoff) {
  if (!ac || !musicBus) return;
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  f.type = 'lowpass';
  f.frequency.value = cutoff || 1600;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.08, dur * 0.2));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(f);
  f.connect(g);
  g.connect(musicBus);
  o.start(t);
  o.stop(t + dur + 0.05);
}

function bassNote(freq, t, dur) {
  if (!ac || !musicBus) return;
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(freq, t);
  f.type = 'lowpass';
  f.frequency.setValueAtTime(520, t);
  f.frequency.exponentialRampToValueAtTime(140, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.16, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(f);
  f.connect(g);
  g.connect(musicBus);
  o.start(t);
  o.stop(t + dur + 0.03);
}

function kickAt(t) {
  if (!ac || !musicBus) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(120, t);
  o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
  g.gain.setValueAtTime(0.4, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
  o.connect(g);
  g.connect(musicBus);
  o.start(t);
  o.stop(t + 0.18);
}

function arpNote(freq, t, dur) {
  if (!ac || !musicBus) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.05, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g);
  g.connect(musicBus);
  if (arpSend) g.connect(arpSend);
  o.start(t);
  o.stop(t + dur + 0.03);
}

function scheduleStep(step, t) {
  const half = step >= 64 ? 1 : 0;
  const bar = Math.floor(step / 16) % 4;
  const chord = CHORDS[bar];
  const s = step % 16;
  if (s === 0) {
    for (let i = 0; i < 3; i++) {
      musicNote(hz(chord[i] + 12), t, STEP16 * 15, 'triangle', 0.016, 1300);
      musicNote(hz(chord[i] + 12) * 1.003, t, STEP16 * 15, 'sine', 0.01, 900);
    }
  }
  if (half && s === 0) noiseAt(0.4, 0.08, 'highpass', 5200, 0.7, t, musicBus);
  if (s === 0 || s === 6 || s === 8 || s === 14) kickAt(t);
  if (s === 4 || s === 12) noiseAt(0.12, 0.2, 'bandpass', 1800, 0.9, t, musicBus);
  if (s % 2 === 0) noiseAt(0.035, s % 4 === 0 ? 0.06 : 0.03, 'highpass', 7500, 0.8, t, musicBus);
  if (half && s % 2 === 1) noiseAt(0.02, 0.018, 'highpass', 9000, 0.7, t, musicBus);
  if (s === 0 || s === 8) bassNote(hz(chord[0] - 12), t, STEP16 * 6);
  if (s === 6 || s === 14) bassNote(hz(chord[0] - 5), t, STEP16 * 2);
  if (s % 2 === 0 && s !== 0) arpNote(hz(chord[3 + ((step / 2) % 3)] + 12 + half * 12), t, STEP16 * 1.5);
  const cyc = Math.min(3, Math.floor(Math.max(0, wave - 1) / 10));
  if (cyc >= 1 && s % 4 === 2) arpNote(hz(chord[1] + 24), t, STEP16 * 1.4);
  if (cyc >= 2 && s === 0) musicNote(hz(chord[2] + 24), t, STEP16 * 8, 'sine', 0.012, 1600);
  if (cyc >= 3 && s % 2 === 1) noiseAt(0.02, 0.014, 'highpass', 9500, 0.7, t, musicBus);
}

function scheduleMusic() {
  if (!ac || !musicOn) return;
  if (musicNext < ac.currentTime - 0.5) musicNext = ac.currentTime + 0.05;
  try {
    while (musicNext < ac.currentTime + 0.25) {
      scheduleStep(musicStep, musicNext);
      musicNext += STEP16;
      musicStep = (musicStep + 1) % 128;
    }
  } catch (e) {
    musicOn = false;
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  }
}

function startMusic() {
  const a = ensureAudio();
  if (!a || musicOn) return;
  musicOn = true;
  musicStep = 0;
  musicNext = a.currentTime + 0.12;
  if (!musicTimer) musicTimer = setInterval(scheduleMusic, 60);
}

function setPointer(e) {
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) * (canvas.width / r.width);
  const y = (e.clientY - r.top) * (canvas.height / r.height);
  pointer.x = (x - view.ox) / view.s;
  pointer.y = (y - view.oy) / view.s;
  pointer.has = true;
}

function burst(x, y, n, color, speed) {
  for (let i = 0; i < n; i++) {

    particles.push({

function ring(x, y, max, color, width) {

function aimDir() {
  let dx = pointer.x - player.x;
  let dy = pointer.y - player.y;
  if (!pointer.has || dx * dx + dy * dy < 36) {
    dx = player.dirx;
    dy = player.diry;
  }
  const d = Math.hypot(dx, dy) || 1;
  return { x: dx / d, y: dy / d };
}

function shoot() {
  if (state !== 'play') return;
  if (!player.has) {
    const now = performance.now();
    if (now - lastDry > 140) {
      lastDry = now;
      sfx.dry();
    }
    return;
  }
  const a = aimDir();
  player.has = false;
  player.kick = 1;
  player.px -= a.x * BAL.player.recoil;
  player.py -= a.y * BAL.player.recoil;
  const cap = BAL.player.recoilCap;
  const m = Math.hypot(player.px, player.py);
  if (m > cap) {
    player.px *= cap / m;
    player.py *= cap / m;
  }
  const sx = player.x + a.x * 20, sy = player.y + a.y * 20;
  const ax = pointer.has ? pointer.x : player.x + a.x * BAL.bullet.range;
  const ay = pointer.has ? pointer.y : player.y + a.y * BAL.bullet.range;
  const maxTravel = Math.max(0, Math.hypot(ax - sx, ay - sy));
  bullet = {
    x: sx, y: sy,
    vx: a.x * BAL.bullet.speed, vy: a.y * BAL.bullet.speed,
    r: BAL.bullet.radius, travel: 0, maxTravel, aimX: ax, aimY: ay,
    state: 'fly', age: 0, hitBoss: false, kills: 0
  };
  player.aimx = a.x;
  player.aimy = a.y;
  burst(player.x + a.x * 20, player.y + a.y * 20, 6, COL.amber, 150);
  ring(player.x + a.x * 24, player.y + a.y * 24, 34, COL.amber, 2);
  shake = Math.max(shake, 6);
  sfx.shot();
  if (!firstShot) {
    firstShot = true;
    say('The bullet is on the ground — walk over it or press 1 to pull it back');
  }
}

function usePull() {
  if (state !== 'play' || pullCd > 0) return;
  if (!bullet || bullet.state !== 'ground') return;
  const tx = player.x, ty = player.y;
  const dx = tx - bullet.x, dy = ty - bullet.y;
  const d = Math.hypot(dx, dy) || 1;
  pullCd = BAL.abilities.pull.cooldown;
  if (runStats) runStats.pulls++;
  bullet.state = 'pull';
  bullet.tx = tx;
  bullet.ty = ty;
  bullet.vx = dx / d * BAL.abilities.pull.speed;
  bullet.vy = dy / d * BAL.abilities.pull.speed;
  bullet.kills = 0;
  bullet.hitBoss = false;
  ring(bullet.x, bullet.y, 46, COL.cyan, 3);
  ring(tx, ty, 40, COL.amber, 2);
  burst(bullet.x, bullet.y, 8, COL.cyan, 160);
  shake = Math.max(shake, 5);
  sfx.pull();
  popup(player.x, player.y - 42, 'PULL', COL.cyan, 16, 0.9);
}

function explodeAt(x, y, radius) {
  const cfg = BAL.abilities.detonate;
  let killed = 0;
  for (const e of enemies.slice()) {
    if (e.phase === 'spawn') continue;
    const rr = radius + e.r;
    if ((e.x - x) ** 2 + (e.y - y) ** 2 < rr * rr) {
      if (e.type === 'shield') {
        e.broken = BAL.enemies.shield.breakTime;
        e.flash = 0.2;
        burst(e.x, e.y, 10, COL.cyan, 180);
        ring(e.x, e.y, e.r + 18, 'rgba(110,231,255,0.7)', 2);
      } else {
        killEnemy(e, 1);
        killed++;
      }
    }
  }
  for (let i = mines.length - 1; i >= 0; i--) {
    const m = mines[i];
    if ((m.x - x) ** 2 + (m.y - y) ** 2 < (radius + 10) ** 2) {
      mines.splice(i, 1);
      burst(m.x, m.y, 5, '#ff9d6e', 120);
    }
  }
  if (boss && boss.spawnT <= 0) {
    const rr = radius + boss.r;
    if ((boss.x - x) ** 2 + (boss.y - y) ** 2 < rr * rr) {
      for (let i = 0; i < (cfg.bossDamage || 1) && boss; i++) damageBoss();
    }
  }
  burst(x, y, 40, COL.rose, 330);
  burst(x, y, 20, COL.amber, 250);
  ring(x, y, radius, 'rgba(255,90,122,0.8)', 4);
  ring(x, y, radius * 0.6, 'rgba(255,209,102,0.7)', 2);
  shake = Math.max(shake, 16);
  hitstop = 0.06;
  sfx.detonate();
  live('Detonation: ' + killed + ' destroyed.');
}

function useDetonate() {
  if (state !== 'play' || detonateCd > 0) return;
  if (!bullet || bullet.state !== 'ground') {
    const now = performance.now();
    if (now - lastDry > 140) {
      lastDry = now;
      sfx.dry();
    }
    return;
  }
  const cfg = BAL.abilities.detonate;
  const bx = bullet.x, by = bullet.y;
  detonateCd = cfg.cooldown;
  if (runStats) runStats.detonates++;
  explodeAt(bx, by, cfg.radius);
  if (state !== 'play') return;
  const dx = player.x - bx, dy = player.y - by;
  const d = Math.hypot(dx, dy) || 1;
  bullet.state = 'pull';
  bullet.tx = player.x;
  bullet.ty = player.y;
  bullet.vx = dx / d * BAL.abilities.pull.speed;
  bullet.vy = dy / d * BAL.abilities.pull.speed;
  bullet.kills = 0;
  bullet.hitBoss = false;
  popup(bx, by - 34, 'DETONATE', COL.rose, 18, 1.1);
}

function pickBullet() {

function maybeDetonateHint() {

function dropBullet() {
