function spawnEnemy(type, ox, oy) {
  const pad = 46;
  let x = ox, y = oy;
  if (x === undefined) {
    const edge = Math.floor(rand(0, 4));
    if (edge === 0) { x = rand(pad, W - pad); y = pad; }
    else if (edge === 1) { x = W - pad; y = rand(pad, H - pad); }
    else if (edge === 2) { x = rand(pad, W - pad); y = H - pad; }
    else { x = pad; y = rand(pad, H - pad); }
  }
  const m = 1 + Math.min(BAL.waves.speedCap, Math.max(0, wave - 1) * BAL.waves.speedPerWave);
  const conf = BAL.enemies[type];
  enemies.push({
    x, y, r: conf.radius, type, mult: m, base: conf.speed * m,
    vx: 0, vy: 0, phase: 'spawn', t: BAL.pacing.spawnWarning,
    dirx: 0, diry: 0, seed: rand(0, TAU), flash: 0,
    fireT: type === 'shooter' ? rand(0.8, 1.6) : 0,
    mineT: type === 'miner' ? rand(0.6, 1.4) : 0,
    snipeT: type === 'sniper' ? rand(1.2, 2.2) : 0,
    ang: type === 'shield' ? rand(0, TAU) : 0,
    broken: 0
  });
}

function bumpStyle(n, label) {
  const before = style;
  style = Math.min(5, style + n);
  styleT = 6;
  styleMax = Math.max(styleMax, style);
  if (style !== before && label) {
    popup(player.x, player.y - 50, label + ' → x' + style, COL.cyan, 14, 1);
    sfx.multi(style);
  }
}

function killEnemy(e, mult) {
  const i = enemies.indexOf(e);
  if (i < 0) return;
  enemies.splice(i, 1);
  if (runStats) runStats.kills[e.type] = (runStats.kills[e.type] || 0) + 1;
  const base = BAL.enemies[e.type].score * (mult || 1);
  const pts = Math.round(base * style);
  score += pts;
  if (style > 1) styleBonus += pts - base;
  popup(e.x, e.y - e.r - 6, '+' + pts, COL.amber, 14, 0.8);
  if ((mult || 1) >= 2) bumpStyle(1, 'MULTI');
  if (Math.hypot(e.x - player.x, e.y - player.y) > 420) bumpStyle(1, 'LONG SHOT');
  const ec = e.type === 'splitter' ? COL.green : e.type === 'dasher' ? COL.violet : e.type === 'shooter' ? COL.amber : e.type === 'shield' ? COL.cyan : e.type === 'miner' ? '#ff9d6e' : e.type === 'bomber' ? '#ffa04d' : COL.rose;
  burst(e.x, e.y, e.type === 'splitter' ? 18 : 11, ec, 220);
  ring(e.x, e.y, e.type === 'splitter' ? 46 : 30, ec, 2);
  shake = Math.max(shake, 5);
  hitstop = 0.045;
  sfx.kill();
  if (e.type === 'splitter') sfx.split();
  if (e.type === 'bomber') explodeBomber(e);
  if (e.type === 'splitter') {
    for (let k = 0; k < BAL.enemies.splitter.sparks; k++) {
      const a = rand(0, TAU);
      spawnEnemy('spark', e.x + Math.cos(a) * 16, e.y + Math.sin(a) * 16);
      const s = enemies[enemies.length - 1];
      s.phase = 'spawn';
      s.t = 0.3;
    }
  }
}

function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy || 1;
  const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / len2));
  return Math.hypot(px - (x1 + dx * t), py - (y1 + dy * t));
}

function fireSniper(e) {
  const cfg = BAL.enemies.sniper;
  const x2 = e.x + e.dirx * cfg.range;
  const y2 = e.y + e.diry * cfg.range;
  beams.push({ x1: e.x, y1: e.y, x2, y2, life: cfg.beamLife, max: cfg.beamLife });
  if (distToSegment(player.x, player.y, e.x, e.y, x2, y2) < cfg.beamRadius + player.r) hurt(e.x, e.y);
  e.phase = 'chase';
  e.t = 0;
  e.snipeT = cfg.cooldown;
  shake = Math.max(shake, 6);
  sfx.snipe();
}

function explodeBomber(e) {
  const cfg = BAL.enemies.bomber;
  burst(e.x, e.y, 24, '#ffa04d', 290);
  ring(e.x, e.y, cfg.blastRadius, 'rgba(255,160,77,0.8)', 3);
  shake = Math.max(shake, 12);
  hitstop = 0.05;
  sfx.bomberBlast();
  const dx = player.x - e.x, dy = player.y - e.y;
  if (dx * dx + dy * dy < cfg.blastRadius * cfg.blastRadius) hurt(e.x, e.y);
}

function damageBoss() {
  if (!boss) return;
  boss.hp--;
  boss.flash = 0.18;
  score += boss.cfg.hitScore;
  hitstop = 0.05;
  shake = Math.max(shake, 8);
  burst(boss.x, boss.y, 14, boss.color || COL.boss, 240);
  sfx.bossHit();
  if (boss.hp <= boss.cfg.enrageAt && !boss.enraged) {
    boss.enraged = true;
    boss.fireT = Math.min(boss.fireT, 1.2);
    popup(boss.x, boss.y - boss.r - 20, boss.name + ' ENRAGED', boss.color || COL.boss, 18, 1.6);
  }
  if (!boss.phase2 && boss.hp > 0 && boss.hp <= Math.ceil(boss.maxHp / 2)) {
    boss.phase2 = true;
    const pat = boss.cfg.pattern;
    const next = pat === 'burst' ? 'spiral' : pat === 'spiral' ? 'ring' : 'burst';
    boss.cfg = Object.assign({}, boss.cfg, {
      pattern: next,
      fireInterval: Math.max(1.1, boss.cfg.fireInterval * 0.8),
      fireIntervalEnraged: Math.max(0.9, boss.cfg.fireIntervalEnraged * 0.85)
    });
    boss.fireT = Math.min(boss.fireT, 0.8);
    popup(boss.x, boss.y - boss.r - 30, 'PHASE 2', boss.color || COL.boss, 20, 1.5);
    ring(boss.x, boss.y, boss.r + 90, boss.color || COL.boss, 3);
    shake = Math.max(shake, 12);
    sfx.charge();
  }
  if (boss.hp <= 0) bossDie();
}

function bossDie() {
  const bx = boss.x, by = boss.y;
  const cfg = boss.cfg;
  boss = null;
  score += cfg.score;
  burst(bx, by, 46, cfg.color || COL.boss, 320);
  burst(bx, by, 26, COL.amber, 260);
  ring(bx, by, 220, cfg.color || COL.boss, 4);
  ring(bx, by, 140, COL.amber, 3);
  shake = 22;
  sfx.victory();
  waveState = 'cleared';
  waveTimer = BAL.pacing.clearPause;
  popup(W / 2, H / 2 - 40, 'WAVE ' + wave + ' CLEARED', '#9fe8ff', 20, 1.4);
  sfx.waveClear();
  live('Boss down. Wave ' + wave + ' cleared. Score ' + score + '.');
}

function hurt(sx, sy) {
  if (state !== 'play' || player.iframes > 0) return;
  player.hp--;
  player.iframes = BAL.player.iframes;
  player.hurtT = 1;
  if (runStats) runStats.hits++;
  waveHits++;
  const dx = player.x - sx, dy = player.y - sy;
  const d = Math.hypot(dx, dy) || 1;
  player.px += dx / d * BAL.player.hurtKnockback;
  player.py += dy / d * BAL.player.hurtKnockback;
  shake = Math.max(shake, 11);
  flash = 0.5;
  sfx.hurt();
  if (player.hp === 1) sfx.critical();
  popup(player.x, player.y - 28, '−1', COL.rose, 20, 0.9);
  burst(player.x, player.y, 10, COL.rose, 180);
  if (player.hp <= 0) {
    state = 'dying';
    dyingT = 0;
    shake = 24;
    burst(player.x, player.y, 30, COL.cyan, 300);
    ring(player.x, player.y, 120, COL.cyan, 3);
    sfx.die();
    live('Run over.');
  }
}

function saveRunRecord() {
  if (!runStats) return;
  lastRun = {
    wave, score, seconds: Math.round(runTime),
    kills: Object.assign({}, runStats.kills),
    killsTotal: Object.keys(runStats.kills).reduce((a, k) => a + runStats.kills[k], 0),
    pulls: runStats.pulls, detonates: runStats.detonates, hits: runStats.hits,
    styleBonus, styleMax
  };
  try { localStorage.setItem('oneBulletLastRun', JSON.stringify(lastRun)); } catch (e) {}
  console.log('[one-bullet] run', lastRun);
}

function finishDeath() {
  if (state === 'dead') return;
  state = 'dead';
  ui.focus = 0;
  setDuck(0.3);
  if (score > S.best) S.best = score;
  S.bestWave = Math.max(S.bestWave || 0, wave);
  saveSettings();
  saveRunRecord();
  live('Wave ' + wave + ', score ' + score + ', best wave ' + S.bestWave + '. Press R to restart.');
}

function startWave() {
  wave++;
  const cycle = Math.floor((wave - 1) / 10);
  applyPalette(cycle % CHAPTERS.length);
  enemies = [];
  boss = null;
  shots = [];
  mines = [];
  beams = [];
  state = 'play';
  waveHits = 0;
  ui.focus = 0;
  setDuck(1);
  if (wave % 10 === 0) {
    const cfg = Object.assign({}, BAL.boss, CHAPTERS[cycle % CHAPTERS.length].boss);
    cfg.hp += cycle;
    cfg.score += cycle * 500;
    boss = {
      x: W / 2, y: 132, vx: 0, vy: 0, r: cfg.radius,
      hp: cfg.hp, maxHp: cfg.hp, spawnT: BAL.pacing.bossSpawn, flash: 0,
      fireT: cfg.firstShot, charge: 0, summonT: cfg.firstSummon, volley: 0,
      enraged: false, ang: 0, spiral: 0, cfg, name: cfg.name, color: cfg.color || COL.boss
    };
    waveState = 'boss';
    waveMod = null;
    blackout = 0;
    const chasers = (cfg.addChasers || 0) + Math.min(3, cycle);
    const dashers = (cfg.addDashers || 0) + Math.min(2, cycle);
    for (let i = 0; i < chasers; i++) spawnEnemy('chaser');
    for (let i = 0; i < dashers; i++) spawnEnemy('dasher');
    popup(W / 2, H / 2 - 60, 'BOSS — ' + cfg.name, cfg.color || COL.boss, 30, 2);
    ring(W / 2, 132, 240, cfg.color || COL.boss, 4);
    shake = 10;
    sfx.boss();
    live('Boss wave. ' + cfg.name + '.');
    return;
  }
  const list = BAL.waves.composition;
  const loopFrom = BAL.waves.loopFrom != null ? BAL.waves.loopFrom : 4;
  const spec = (wave <= 10
    ? list[wave - 1]
    : list[loopFrom + ((wave - 11) % Math.max(1, list.length - 1 - loopFrom))])
    || { chasers: 0, dashers: 0, splitters: 0 };
  const extra = Math.min(6, cycle);
  const extraSplit = Math.min(3, cycle);
  const extraShoot = Math.min(2, cycle);
  const extraSpecial = Math.min(2, Math.floor(cycle / 2));
  const ease = cycle === 1 ? (BAL.waves.loopEase != null ? BAL.waves.loopEase : 1) : 1;
  const cnt = n => Math.max(0, Math.round(n * ease));
  waveMod = null;
  const mods = BAL.waves.modifiers || [];
  if (wave >= 5 && wave % 3 === 0 && mods.length) {
    waveMod = mods[Math.floor((wave - 6) / 3) % mods.length];
  }
  blackout = waveMod && waveMod.id === 'BLACKOUT' ? 1 : 0;
  spawnDelay = typeof spec.spawn === 'number' ? spec.spawn : BAL.pacing.spawnInterval;
  spawnQueue = [];
  for (let i = 0; i < cnt(spec.chasers + extra); i++) spawnQueue.push('chaser');
  for (let i = 0; i < cnt(spec.dashers + extra); i++) spawnQueue.push('dasher');
  for (let i = 0; i < cnt(spec.splitters + extraSplit); i++) spawnQueue.push('splitter');
  for (let i = 0; i < cnt((spec.shooters || 0) + extraShoot); i++) spawnQueue.push('shooter');
  for (let i = 0; i < cnt((spec.miners || 0) + extraSpecial); i++) spawnQueue.push('miner');
  for (let i = 0; i < cnt((spec.shields || 0) + extraSpecial); i++) spawnQueue.push('shield');
  for (let i = 0; i < cnt(spec.bombers || 0); i++) spawnQueue.push('bomber');
  for (let i = 0; i < cnt(spec.snipers || 0); i++) spawnQueue.push('sniper');
  if (waveMod) {
    if (waveMod.id === 'RUSH') spawnDelay *= waveMod.spawnScale != null ? waveMod.spawnScale : 0.55;
    for (let i = 0; i < (waveMod.splitters || 0); i++) spawnQueue.push('splitter');
    for (let i = 0; i < (waveMod.dashers || 0); i++) spawnQueue.push('dasher');
  }
  for (let i = spawnQueue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = spawnQueue[i];
    spawnQueue[i] = spawnQueue[j];
    spawnQueue[j] = t;
  }
  spawnTimer = BAL.pacing.spawnFirst;
  waveState = 'spawning';
  popup(W / 2, 140, 'WAVE ' + wave + (spec.name ? ' — ' + spec.name : ''), '#9fb6d8', 24, 1.4);
  sfx.wave();
  live('Wave ' + wave + (spec.name ? '. ' + spec.name + '.' : '.'));
  if (waveMod) {
    popup(W / 2, 176, 'MODIFIER — ' + waveMod.id, COL.amber, 18, 1.6);
    live('Modifier: ' + waveMod.id + '.');
  }
  if (wave === 3) say('Diamonds dash; the shooter keeps range — close in');
  if (wave === 5) say('Green ones split — finish the shards');
  if (wave === 6) say('Miners hang back and seed mines — do not get boxed in');
  if (wave === 7) say('Shields block the front — hit their back');
  if (wave % 4 === 0 && player.hp < player.maxHp) {
    player.hp++;
    sfx.heal();
    popup(player.x, player.y - 30, '+1 HP', COL.cyan, 16, 1.2);
  }
}

function updateHint(dt) {
  if (hint) {
    hint.life -= dt;
    if (hint.life <= 0) hint = null;
  }
  while (hintQueue.length && elapsed >= hintQueue[0].t) {
    const h = hintQueue.shift();
    say(h.text);
    if (hint) hint.life = h.life || hint.life;
  }
}

function updatePlayer(dt) {
  const p = player;
  let ix = 0, iy = 0;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) ix -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) ix += 1;
  if (keys.has('KeyW') || keys.has('ArrowUp')) iy -= 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) iy += 1;
  if (ix || iy) {
    const d = Math.hypot(ix, iy);
    p.dirx = ix / d;
    p.diry = iy / d;
  }
  const SPEED = BAL.player.speed;
  const k = 1 - Math.exp(-16 * dt);
  p.vx += (ix * SPEED - p.vx) * k;
  p.vy += (iy * SPEED - p.vy) * k;
  const damp = Math.exp(-4.2 * dt);
  p.px *= damp;
  p.py *= damp;
  p.x += (p.vx + p.px) * dt;
  p.y += (p.vy + p.py) * dt;
  if (p.x < p.r) { p.x = p.r; p.px = Math.abs(p.px) * 0.25; p.vx = 0; }
  if (p.x > W - p.r) { p.x = W - p.r; p.px = -Math.abs(p.px) * 0.25; p.vx = 0; }
  if (p.y < p.r) { p.y = p.r; p.py = Math.abs(p.py) * 0.25; p.vy = 0; }
  if (p.y > H - p.r) { p.y = H - p.r; p.py = -Math.abs(p.py) * 0.25; p.vy = 0; }
  if (p.iframes > 0) p.iframes -= dt;
  p.kick *= Math.exp(-9 * dt);
  p.pick *= Math.exp(-7 * dt);
  p.hurtT *= Math.exp(-7 * dt);
  p.move = Math.min(1, Math.hypot(p.vx + p.px, p.vy + p.py) / Math.max(1, SPEED));

  let tx = 0, ty = 0;
  if (pointer.has) { tx = pointer.x - p.x; ty = pointer.y - p.y; }
  if (tx * tx + ty * ty < 36) {
    const vx = p.vx + p.px, vy = p.vy + p.py;
    if (vx * vx + vy * vy > 16) { tx = vx; ty = vy; }
    else { tx = p.dirx; ty = p.diry; }
  }
  const ta = Math.atan2(ty, tx);
  const da = ((ta - p.aimA + Math.PI) % TAU + TAU) % TAU - Math.PI;
  p.aimA += da * Math.min(1, 16 * dt);

  const sp = Math.hypot(p.vx + p.px, p.vy + p.py);
  if (sp > 90 && Math.random() < 0.5) {
    const a = Math.atan2(-(p.vy + p.py), -(p.vx + p.px));
    particles.push({
      x: p.x + Math.cos(a) * 10, y: p.y + Math.sin(a) * 10,
      vx: Math.cos(a) * rand(20, 60), vy: Math.sin(a) * rand(20, 60),
      life: 0.3, max: 0.3, size: rand(1, 2.2), color: 'rgba(110,231,255,0.6)'
    });
  }

  if (bullet && bullet.state === 'ground') {
    const rr = p.r + BAL.player.pickupRadius;
    const dx = p.x - bullet.x, dy = p.y - bullet.y;
    if (dx * dx + dy * dy < rr * rr) pickBullet();
  }
}

function updateBullet(dt) {
  const b = bullet;
  if (!b) return;
  b.age += dt;
  if (b.state === 'pull') {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (e.phase === 'spawn') continue;
      const rr = b.r + e.r + 4;
      const dx = b.x - e.x, dy = b.y - e.y;
      if (dx * dx + dy * dy < rr * rr) {
        b.kills = (b.kills || 0) + 1;
        const m = Math.min(b.kills, 3);
        killEnemy(e, m);
        if (m >= 2) {
          popup(e.x, e.y - e.r - 24, m === 2 ? 'DOUBLE' : 'TRIPLE', COL.amber, 18, 1);
          sfx.multi(m);
        }
        break;
      }
    }
    if (state !== 'play') return;
    if (boss && boss.spawnT <= 0 && !b.hitBoss) {
      const dx = b.x - boss.x, dy = b.y - boss.y;
      const rr = b.r + boss.r;
      if (dx * dx + dy * dy < rr * rr) {
        b.hitBoss = true;
        damageBoss();
        if (state !== 'play') return;
      }
    }
    const tx = b.tx - b.x, ty = b.ty - b.y;
    if (tx * tx + ty * ty < 16 * 16) {
      b.x = b.tx;
      b.y = b.ty;
      const pr = player.r + BAL.player.pickupRadius;
      const pd = (player.x - b.x) ** 2 + (player.y - b.y) ** 2;
      if (pd < pr * pr) pickBullet();
      else dropBullet();
    }
    return;
  }
  if (b.state === 'bounce') {
    const step = Math.hypot(b.vx, b.vy) * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.bounceLeft -= step;
    if (b.x < b.r || b.x > W - b.r || b.y < b.r || b.y > H - b.r) {
      b.x = clamp(b.x, b.r, W - b.r);
      b.y = clamp(b.y, b.r, H - b.r);
      dropBullet();
      return;
    }
    bulletContact();
    if (b.bounceLeft <= 0) dropBullet();
    return;
  }
  if (b.state !== 'fly') return;
  b.x += b.vx * dt;
  b.y += b.vy * dt;
  b.travel += Math.hypot(b.vx, b.vy) * dt;
  if (b.x < b.r || b.x > W - b.r || b.y < b.r || b.y > H - b.r) {
    startBounce();
    return;
  }
  bulletContact();
  if (b.travel >= b.maxTravel) {
    b.x = b.aimX;
    b.y = b.aimY;
    bulletContact();
    dropBullet();
  }
}

function startBounce() {
  const b = bullet;
  if (!b) return;
  const speed = Math.hypot(b.vx, b.vy) || 1;
  if (b.x <= b.r) { b.x = b.r; b.vx = Math.abs(b.vx); }
  else if (b.x >= W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); }
  if (b.y <= b.r) { b.y = b.r; b.vy = Math.abs(b.vy); }
  else if (b.y >= H - b.r) { b.y = H - b.r; b.vy = -Math.abs(b.vy); }
  const factor = BAL.bullet.bounceFactor != null ? BAL.bullet.bounceFactor : 0.25;
  const retain = BAL.bullet.bounceRetain != null ? BAL.bullet.bounceRetain : 0.7;
  const dir = Math.hypot(b.vx, b.vy) || 1;
  const sp = speed * retain;
  b.vx = b.vx / dir * sp;
  b.vy = b.vy / dir * sp;
  b.state = 'bounce';
  b.bounceLeft = Math.max(24, speed * factor);
  burst(b.x, b.y, 8, COL.cyan, 140);
  ring(b.x, b.y, 30, COL.cyan, 2);
  sfx.bounce();
}

function shieldBlocks(e) {
  const b = bullet;
  if (!b || e.broken > 0) return false;
  const cfg = BAL.enemies.shield;
  const a = Math.atan2(b.y - e.y, b.x - e.x);
  const diff = Math.abs(((a - e.ang + Math.PI) % TAU + TAU) % TAU - Math.PI);
  return diff < cfg.arc / 2;
}

function deflectBullet(e) {
  const b = bullet;
  const nx = b.x - e.x, ny = b.y - e.y;
  const nd = Math.hypot(nx, ny) || 1;
  const ux = nx / nd, uy = ny / nd;
  const sp = Math.hypot(b.vx, b.vy) || 1;
  const dot = b.vx * ux + b.vy * uy;
  const factor = BAL.bullet.bounceFactor != null ? BAL.bullet.bounceFactor : 0.25;
  b.vx = (b.vx - 2 * dot * ux) * 0.8;
  b.vy = (b.vy - 2 * dot * uy) * 0.8;
  b.x = e.x + ux * (b.r + e.r + 1);
  b.y = e.y + uy * (b.r + e.r + 1);
  b.state = 'bounce';
  b.bounceLeft = Math.max(24, sp * 0.8 * factor);
  e.flash = 0.16;
  burst(b.x, b.y, 8, COL.cyan, 160);
  ring(e.x, e.y, e.r + 14, 'rgba(110,231,255,0.6)', 2);
  sfx.shieldBlock();
}

function bulletContact() {
  const b = bullet;
  if (!b) return;
  for (let i = mines.length - 1; i >= 0; i--) {
    const m = mines[i];
    const rr = b.r + 12;
    if ((m.x - b.x) ** 2 + (m.y - b.y) ** 2 < rr * rr) {
      mines.splice(i, 1);
      burst(m.x, m.y, 8, '#ff9d6e', 150);
      ring(m.x, m.y, 20, 'rgba(255,157,110,0.6)', 2);
      sfx.minePlant();
      popup(m.x, m.y - 16, 'DEFUSED', COL.cyan, 12, 0.8);
      break;
    }
  }
  if (boss && boss.spawnT <= 0 && !b.hitBoss) {
    const dx = b.x - boss.x, dy = b.y - boss.y;
    const rr = b.r + boss.r;
    if (dx * dx + dy * dy < rr * rr) {
      b.hitBoss = true;
      damageBoss();
      b.vx *= 0.92;
      b.vy *= 0.92;
    }
  }
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (e.phase === 'spawn') continue;
    const rr = b.r + e.r;
    const dx = b.x - e.x, dy = b.y - e.y;
    if (dx * dx + dy * dy < rr * rr) {
      if (e.type === 'shield' && shieldBlocks(e)) {
        deflectBullet(e);
        break;
      }
      b.kills = (b.kills || 0) + 1;
      const m = Math.min(b.kills, 3);
      killEnemy(e, m);
      if (m >= 2) {
        popup(e.x, e.y - e.r - 24, m === 2 ? 'DOUBLE' : 'TRIPLE', COL.amber, 18, 1);
        sfx.multi(m);
      }
      b.vx *= 0.86;
      b.vy *= 0.86;
      break;
    }
  }
}

function plantMine(e) {
  const cfg = BAL.enemies.miner;
  const dx = player.x - e.x, dy = player.y - e.y;
  const d = Math.hypot(dx, dy) || 1;
  mines.push({
    x: clamp(e.x + dx / d * (e.r + 40), 12, W - 12),
    y: clamp(e.y + dy / d * (e.r + 40), 12, H - 12),
    arm: cfg.mineArm, life: cfg.mineLife
  });
  burst(e.x, e.y, 4, '#ff9d6e', 80);
  sfx.minePlant();
}

function explodeMine(m) {
  const cfg = BAL.enemies.miner;
  burst(m.x, m.y, 16, '#ff9d6e', 250);
  ring(m.x, m.y, cfg.mineRadius, 'rgba(255,157,110,0.75)', 3);
  shake = Math.max(shake, 9);
  sfx.mineBlast();
  const dx = player.x - m.x, dy = player.y - m.y;
  if (dx * dx + dy * dy < cfg.mineRadius * cfg.mineRadius) hurt(m.x, m.y);
}

function updateMines(dt) {
  const cfg = BAL.enemies.miner;
  for (let i = mines.length - 1; i >= 0; i--) {
    const m = mines[i];
    m.life -= dt;
    if (m.arm > 0) m.arm -= dt;
    const dx = player.x - m.x, dy = player.y - m.y;
    const hit = m.arm <= 0 && dx * dx + dy * dy < cfg.mineTrigger * cfg.mineTrigger;
    if (hit || m.life <= 0) {
      mines.splice(i, 1);
      if (hit) explodeMine(m);
      else burst(m.x, m.y, 4, COL.dim, 50);
    }
  }
}

function updateEnemies(dt) {
  const p = player;
  for (const e of enemies) {
    if (e.flash > 0) e.flash -= dt;
    if (e.broken > 0) e.broken -= dt;
    if (e.phase === 'spawn') {
      e.t -= dt;
      if (e.t <= 0) {
        e.phase = 'chase';
        e.t = rand(0.8, 1.6);
      }
      continue;
    }
    const dx = p.x - e.x, dy = p.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    if (e.phase === 'chase' && e.type === 'shooter') {
      const cfg = BAL.enemies.shooter;
      const k = Math.min(1, 5 * dt);
      let mx, my;
      if (d < cfg.keepMin) { mx = -dx / d; my = -dy / d; }
      else if (d > cfg.keepMax) { mx = dx / d; my = dy / d; }
      else {
        const side = Math.cos(e.seed) >= 0 ? 1 : -1;
        mx = -dy / d * side;
        my = dx / d * side;
      }
      e.vx += (mx * e.base - e.vx) * k;
      e.vy += (my * e.base - e.vy) * k;
      e.fireT -= dt;
      if (e.fireT <= 0 && d < cfg.range) {
        e.phase = 'aim';
        e.t = cfg.telegraph;
        e.dirx = dx / d;
        e.diry = dy / d;
      }
    } else if (e.phase === 'chase' && e.type === 'sniper') {
      const cfg = BAL.enemies.sniper;
      const k = Math.min(1, 4 * dt);
      let mx = 0, my = 0;
      if (d < 300) { mx = -dx / d; my = -dy / d; }
      else if (d > 440) { mx = dx / d; my = dy / d; }
      e.vx += (mx * e.base - e.vx) * k;
      e.vy += (my * e.base - e.vy) * k;
      e.snipeT -= dt;
      if (e.snipeT <= 0 && d < cfg.range) {
        e.phase = 'aim';
        e.t = cfg.aimTime;
        const a = Math.atan2(dy, dx);
        e.dirx = Math.cos(a);
        e.diry = Math.sin(a);
        sfx.snipeWarn();
      }
    } else if (e.phase === 'aim' && e.type === 'sniper') {
      e.vx *= 0.85;
      e.vy *= 0.85;
      e.t -= dt;
      if (e.t <= 0) fireSniper(e);
    } else if (e.phase === 'chase' && e.type === 'miner') {
      const cfg = BAL.enemies.miner;
      const k = Math.min(1, 3 * dt);
      let mx, my;
      if (d < cfg.keepMin) { mx = -dx / d; my = -dy / d; }
      else if (d > cfg.keepMax) { mx = dx / d; my = dy / d; }
      else {
        const side = Math.cos(e.seed) >= 0 ? 1 : -1;
        const mid = (cfg.keepMin + cfg.keepMax) / 2;
        const radial = clamp((d - mid) / 80, -1, 1);
        mx = (-dy / d) * side * 0.85 + (dx / d) * radial * 0.6;
        my = (dx / d) * side * 0.85 + (dy / d) * radial * 0.6;
        const len = Math.hypot(mx, my) || 1;
        mx /= len;
        my /= len;
      }
      e.vx += (mx * e.base - e.vx) * k;
      e.vy += (my * e.base - e.vy) * k;
      e.mineT -= dt;
      if (e.mineT <= 0) {
        e.mineT = cfg.mineInterval;
        if (mines.length < cfg.mineCap) plantMine(e);
      }
    } else if (e.phase === 'chase') {
      const sp = e.base;
      const k = Math.min(1, 5 * dt);
      e.vx += (dx / d * sp - e.vx) * k;
      e.vy += (dy / d * sp - e.vy) * k;
      if (e.type === 'shield') {
        const want = Math.atan2(dy, dx);
        const diff = ((want - e.ang + Math.PI) % TAU + TAU) % TAU - Math.PI;
        const step = BAL.enemies.shield.turn * dt;
        e.ang += clamp(diff, -step, step);
      }
      if (e.type === 'dasher') {
        e.t -= dt;
        if (e.t <= 0 && d < 470) {
          e.phase = 'telegraph';
          e.t = BAL.enemies.dasher.telegraph;
          e.dirx = dx / d;
          e.diry = dy / d;
          sfx.dashWarn();
        }
      }
    } else if (e.phase === 'aim') {
      e.vx *= 0.8;
      e.vy *= 0.8;
      e.t -= dt;
      const cfg = BAL.enemies.shooter;
      e.dirx = dx / d;
      e.diry = dy / d;
      if (e.t <= 0) {
        const a = Math.atan2(dy, dx);
        shots.push({
          x: e.x + Math.cos(a) * (e.r + 8),
          y: e.y + Math.sin(a) * (e.r + 8),
          vx: Math.cos(a) * cfg.shotSpeed,
          vy: Math.sin(a) * cfg.shotSpeed,
          r: cfg.shotRadius, life: cfg.shotLife
        });
        e.phase = 'chase';
        e.fireT = cfg.fireInterval;
        sfx.enemyShot();
        burst(e.x + Math.cos(a) * (e.r + 8), e.y + Math.sin(a) * (e.r + 8), 4, COL.amber, 90);
      }
    } else if (e.phase === 'telegraph') {
      e.vx *= 0.82;
      e.vy *= 0.82;
      e.t -= dt;
      if (e.t <= 0) { e.phase = 'dash'; e.t = BAL.enemies.dasher.dash; }
    } else if (e.phase === 'dash') {
      e.vx = e.dirx * BAL.enemies.dasher.dashSpeed * e.mult;
      e.vy = e.diry * BAL.enemies.dasher.dashSpeed * e.mult;
      e.t -= dt;
      if (e.t <= 0) { e.phase = 'recover'; e.t = BAL.enemies.dasher.recover; }
    } else if (e.phase === 'recover') {
      e.vx *= Math.exp(-6 * dt);
      e.vy *= Math.exp(-6 * dt);
      e.t -= dt;
      if (e.t <= 0) { e.phase = 'chase'; e.t = rand(1.3, 2.2); }
    }
    e.x += e.vx * dt;
    e.y += e.vy * dt;
    if (e.x < e.r) { e.x = e.r; e.vx = Math.abs(e.vx) * 0.3; if (e.phase === 'dash') { e.phase = 'recover'; e.t = 0.6; } }
    if (e.x > W - e.r) { e.x = W - e.r; e.vx = -Math.abs(e.vx) * 0.3; if (e.phase === 'dash') { e.phase = 'recover'; e.t = 0.6; } }
    if (e.y < e.r) { e.y = e.r; e.vy = Math.abs(e.vy) * 0.3; if (e.phase === 'dash') { e.phase = 'recover'; e.t = 0.6; } }
    if (e.y > H - e.r) { e.y = H - e.r; e.vy = -Math.abs(e.vy) * 0.3; if (e.phase === 'dash') { e.phase = 'recover'; e.t = 0.6; } }
  }

  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i];
    for (let j = i + 1; j < enemies.length; j++) {
      const b = enemies[j];
      if (a.phase === 'spawn' || b.phase === 'spawn') continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const rr = a.r + b.r;
      const d2 = dx * dx + dy * dy;
      if (d2 > 0.001 && d2 < rr * rr) {
        const d = Math.sqrt(d2);
        const push = (rr - d) * 0.5;
        const nx = dx / d, ny = dy / d;
        a.x -= nx * push;
        a.y -= ny * push;
        b.x += nx * push;
        b.y += ny * push;
      }
    }
  }

  for (const e of enemies) {
    if (e.phase === 'spawn') continue;
    const rr = e.r + p.r - 4;
    const dx = p.x - e.x, dy = p.y - e.y;
    if (dx * dx + dy * dy < rr * rr) {
      if (e.type === 'bomber') { killEnemy(e, 1); return; }
      hurt(e.x, e.y);
      return;
    }
  }
}

function updateBoss(dt) {
  const b = boss;
  if (!b) return;
  b.ang += dt * 0.7;
  if (b.flash > 0) b.flash -= dt;
  if (b.spawnT > 0) {
    b.spawnT -= dt;
    return;
  }
  const p = player;
  const dx = p.x - b.x, dy = p.y - b.y;
  const d = Math.hypot(dx, dy) || 1;
  const sp = b.enraged ? b.cfg.speedEnraged : b.cfg.speed;
  b.vx += (dx / d * sp - b.vx) * Math.min(1, 2.2 * dt);
  b.vy += (dy / d * sp - b.vy) * Math.min(1, 2.2 * dt);
  b.x = clamp(b.x + b.vx * dt, b.r + 2, W - b.r - 2);
  b.y = clamp(b.y + b.vy * dt, b.r + 2, H - b.r - 2);

  if (d < b.r + p.r - 8) {
    hurt(b.x, b.y);
    if (state !== 'play') return;
  }

  b.fireT -= dt;
  if (b.charge > 0) {
    b.charge -= dt;
    if (b.charge <= 0) {
      const spd = b.enraged ? b.cfg.shotSpeedEnraged : b.cfg.shotSpeed;
      const shootAt = a => shots.push({
        x: b.x + Math.cos(a) * (b.r * 0.85),
        y: b.y + Math.sin(a) * (b.r * 0.85),
        vx: Math.cos(a) * spd,
        vy: Math.sin(a) * spd,
        r: b.cfg.shotRadius, life: b.cfg.shotLife
      });
      if (b.cfg.pattern === 'burst') {
        const a0 = Math.atan2(p.y - b.y, p.x - b.x);
        for (let i = 0; i < 5; i++) shootAt(a0 + (i - 2) * 0.14);
      } else if (b.cfg.pattern === 'spiral') {
        for (let i = 0; i < 3; i++) shootAt(b.spiral + i * TAU / 3);
        b.spiral += 0.55;
      } else {
        const n = b.cfg.volley;
        const off = b.volley * 0.26;
        for (let i = 0; i < n; i++) shootAt(off + i * TAU / n);
        b.volley++;
      }
      b.fireT = b.enraged ? b.cfg.fireIntervalEnraged : b.cfg.fireInterval;
      shake = Math.max(shake, 5);
      burst(b.x, b.y, 10, COL.shot, 170);
      sfx.volley();
    }
  } else if (b.fireT <= 0) {
    b.charge = b.cfg.charge;
    sfx.charge();
  }

  b.summonT -= dt;
  if (b.summonT <= 0) {
    b.summonT = b.cfg.summonInterval;
    let adds = 0;
    for (const e of enemies) if (e.type === 'chaser' && e.phase !== 'spawn') adds++;
    if (adds < b.cfg.summonCap) {
      for (let k = 0; k < b.cfg.summonAdds; k++) {
        const a = b.ang + k * Math.PI;
        spawnEnemy('chaser', b.x + Math.cos(a) * (b.r + 26), b.y + Math.sin(a) * (b.r + 26));
      }
      ring(b.x, b.y, 90, COL.rose, 2);
      sfx.summon();
    }
  }
}

function updateShots(dt) {
  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i];
    s.life -= dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    if (s.life <= 0 || s.x < -20 || s.x > W + 20 || s.y < -20 || s.y > H + 20) {
      shots.splice(i, 1);
      continue;
    }
    const dx = s.x - player.x, dy = s.y - player.y;
    const rr = s.r + player.r - 2;
    if (player.iframes <= 0 && dx * dx + dy * dy < rr * rr) {
      shots.splice(i, 1);
      hurt(s.x, s.y);
      if (state !== 'play') return;
    }
  }
}

function updateWave(dt) {
  if (waveState === 'intro') {
    waveTimer -= dt;
    if (waveTimer <= 0) startWave();
    return;
  }
  if (waveState === 'spawning') {
    if (spawnQueue.length) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnEnemy(spawnQueue.shift());
        spawnTimer = spawnDelay;
      }
    } else if (!enemies.length) {
      waveState = 'cleared';
      waveTimer = BAL.pacing.clearPause;
      if (waveHits === 0) bumpStyle(1, 'FLAWLESS');
      score += BAL.waves.clearBonus * wave;
      popup(W / 2, H / 2 - 40, 'WAVE CLEARED  +' + (BAL.waves.clearBonus * wave), '#9fe8ff', 20, 1.6);
      ring(W / 2, H / 2, 260, 'rgba(159,232,255,0.6)', 1);
      sfx.waveClear();
    }
  } else if (waveState === 'cleared') {
    waveTimer -= dt;
    if (waveTimer <= 0) startWave();
  }
}

function updateFx(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= Math.exp(-3 * dt);
    p.vy *= Math.exp(-3 * dt);
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.life -= dt;
    if (r.life <= 0) { rings.splice(i, 1); continue; }
    r.r += (r.max - r.r) * Math.min(1, 7 * dt);
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.life -= dt;
    if (p.life <= 0) { popups.splice(i, 1); continue; }
    p.y -= 26 * dt;
  }
  for (let i = beams.length - 1; i >= 0; i--) {
    beams[i].life -= dt;
    if (beams[i].life <= 0) beams.splice(i, 1);
  }
  for (const d of dust) {
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    if (d.x < 0) d.x += W;
    if (d.x > W) d.x -= W;
    if (d.y < 0) d.y += H;
    if (d.y > H) d.y -= H;
  }
  if (shake > 0) shake = Math.max(0, shake - 38 * dt);
  if (flash > 0) flash = Math.max(0, flash - 2.2 * dt);
}

function update(dt) {
  if (hitstop > 0) {
    hitstop -= dt;
    dt *= 0.2;
  }
  runTime += dt;
  elapsed += dt;
  if (pullCd > 0) pullCd -= dt;
  if (detonateCd > 0) detonateCd -= dt;
  if (styleT > 0) {
    styleT -= dt;
    if (styleT <= 0) style = 1;
  }
  updateHint(dt);
  updatePlayer(dt);
  updateBullet(dt);
  updateEnemies(dt);
  updateMines(dt);
  updateBoss(dt);
  updateShots(dt);
  updateWave(dt);
  updateFx(dt);
}

function drawArena() {
  const g = ctx.createRadialGradient(W / 2, H / 2, 60, W / 2, H / 2, 760);
  g.addColorStop(0, COL.bg0);
  g.addColorStop(1, COL.bg1);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  if (imgReady(IMG.bg)) {
    ctx.globalAlpha = 0.45;
    ctx.drawImage(IMG.bg, 0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  const chapter = CHAPTERS[Math.floor(Math.max(0, wave - 1) / 10) % CHAPTERS.length];
  if (chapter && chapter.boss && chapter.boss.color) {
    ctx.globalAlpha = 0.05;
    ctx.fillStyle = chapter.boss.color;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  const now = performance.now() / 1000;
  for (const n of nebula) {
    const nx = n.x + Math.cos(now * n.sp) * 30;
    const ny = n.y + Math.sin(now * n.sp * 0.8) * 22;
    const ng = ctx.createRadialGradient(nx, ny, 0, nx, ny, n.r);
    ng.addColorStop(0, n.c);
    ng.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = ng;
    ctx.fillRect(nx - n.r, ny - n.r, n.r * 2, n.r * 2);
  }
  for (const s of stars) {
    ctx.globalAlpha = s.a * (0.6 + 0.4 * Math.sin(now * s.s + s.p));
    ctx.fillStyle = '#cfe6ff';
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }
  ctx.globalAlpha = 1;

  ctx.strokeStyle = COL.grid;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 64; x < W; x += 64) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
  for (let y = 64; y < H; y += 64) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
  ctx.stroke();

  ctx.strokeStyle = 'rgba(90,140,215,0.05)';
  ctx.beginPath();
  ctx.arc(W / 2, H / 2, 232, 0, TAU);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(W / 2, H / 2, 150, 0, TAU);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(110,231,255,0.06)';
  ctx.setLineDash([2, 14]);
  ctx.lineDashOffset = (performance.now() / 1000) * 18;
  ctx.beginPath();
  ctx.arc(W / 2, H / 2, 300, 0, TAU);
  ctx.stroke();
  ctx.setLineDash([]);

  for (const d of dust) {
    ctx.globalAlpha = d.a;
    ctx.fillStyle = '#9fc9ff';
    ctx.fillRect(d.x, d.y, d.r, d.r);
  }
  ctx.globalAlpha = 1;

  if (blackout) {
    ctx.fillStyle = 'rgba(2,5,12,0.58)';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.strokeStyle = COL.border;
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, H - 2);

  const c = 26;
  ctx.strokeStyle = 'rgba(150,200,255,0.55)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(2, c); ctx.lineTo(2, 2); ctx.lineTo(c, 2);
  ctx.moveTo(W - c, 2); ctx.lineTo(W - 2, 2); ctx.lineTo(W - 2, c);
  ctx.moveTo(W - 2, H - c); ctx.lineTo(W - 2, H - 2); ctx.lineTo(W - c, H - 2);
  ctx.moveTo(c, H - 2); ctx.lineTo(2, H - 2); ctx.lineTo(2, H - c);
  ctx.stroke();
}

function drawRings() {
  for (const r of rings) {
    ctx.globalAlpha = Math.max(0, r.life / r.maxLife) * 0.8;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = r.width;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, TAU);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function guideLine(x1, y1, x2, y2, color, width, dash) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.setLineDash(dash);
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.setLineDash([]);
  const s = 8;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - Math.cos(a - 0.45) * s, y2 - Math.sin(a - 0.45) * s);
  ctx.lineTo(x2 - Math.cos(a + 0.45) * s, y2 - Math.sin(a + 0.45) * s);
  ctx.closePath();
  ctx.fill();
}

function drawPlayer(t) {
  if (!player) return;
  const p = player;
  let alpha = 1;
  if (p.iframes > 0) alpha = 0.35 + 0.65 * Math.abs(Math.sin(t * 18));

  const speed = Math.hypot(p.vx + p.px, p.vy + p.py);
  const mv = p.move != null ? p.move : Math.min(1, speed / BAL.player.speed);
  const idle = speed < 22;
  const kick = p.kick || 0;
  const pickT = p.pick || 0;
  const hurt = p.hurtT || 0;
  const breathe = 1 + (idle ? 0.022 * Math.sin(t * 3.1) : 0.008 * Math.sin(t * 9));
  const scale = breathe * (1 + 0.15 * kick + 0.2 * pickT);
  const bodyAng = speed > 10 ? Math.atan2(p.vy + p.py, p.vx + p.px) : p.aimA;
  const stretch = 1 + 0.12 * mv;

  ctx.save();
  if (hurt > 0) {
    ctx.translate((Math.random() - 0.5) * 4 * hurt, (Math.random() - 0.5) * 4 * hurt);
  }
  if (idle) ctx.translate(0, Math.sin(t * 2.6) * 0.9);

  if (mv > 0.2) {
    for (let i = 1; i <= 2; i++) {
      ctx.globalAlpha = alpha * 0.11 * mv;
      ctx.fillStyle = COL.cyan;
      ctx.beginPath();
      ctx.arc(
        p.x - Math.cos(bodyAng) * p.r * (1.1 + i * 0.5),
        p.y - Math.sin(bodyAng) * p.r * (1.1 + i * 0.5),
        p.r * (1 - 0.22 * i), 0, TAU
      );
      ctx.fill();
    }
  }
  ctx.globalAlpha = alpha;

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(bodyAng);
  ctx.scale(stretch * scale, (2 - stretch) * scale);
  ctx.shadowColor = 'rgba(87,216,255,0.9)';
  ctx.shadowBlur = 20;
  ctx.fillStyle = COL.cyan;
  ctx.beginPath();
  ctx.arc(0, 0, p.r, 0, TAU);
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = '#04202a';
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r * 0.52, 0, TAU);
  ctx.fill();
  ctx.fillStyle = p.has ? 'rgba(255,209,102,0.95)' : 'rgba(110,231,255,0.32)';
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r * (0.24 + 0.05 * kick), 0, TAU);
  ctx.fill();

  ctx.save();
  ctx.strokeStyle = p.has ? 'rgba(255,209,102,0.7)' : 'rgba(110,231,255,0.32)';
  ctx.lineWidth = 2;
  ctx.setLineDash(p.has ? [] : [4, 5]);
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r + 4 + 2 * kick, 0, TAU);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.aimA);
  ctx.strokeStyle = p.has ? 'rgba(255,209,102,0.95)' : 'rgba(159,182,216,0.55)';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(p.r + 7, -6);
  ctx.lineTo(p.r + 13, 0);
  ctx.lineTo(p.r + 7, 6);
  ctx.stroke();
  ctx.lineCap = 'butt';
  if (p.has) {
    ctx.fillStyle = COL.amber;
    ctx.beginPath();
    ctx.arc(p.r + 15, 0, 2.6, 0, TAU);
    ctx.fill();
  }
  if (kick > 0.05) {
    ctx.globalAlpha = alpha * kick;
    ctx.fillStyle = '#fff2c4';
    ctx.beginPath();
    ctx.arc(p.r + 16, 0, 3.4 * kick, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = alpha;

  if (pickT > 0.02) {
    ctx.strokeStyle = 'rgba(255,209,102,' + (0.6 * pickT) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r + 6 + 14 * (1 - pickT), 0, TAU);
    ctx.stroke();
  }
  if (hurt > 0.02) {
    ctx.strokeStyle = 'rgba(255,90,122,' + (0.7 * hurt) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r + 3, 0, TAU);
    ctx.stroke();
  }

  if (pointer.has) {
    const dx = pointer.x - p.x, dy = pointer.y - p.y;
    const d = Math.hypot(dx, dy);
    if (d > p.r + 14) {
      const a = Math.atan2(dy, dx);
      guideLine(
        p.x + Math.cos(a) * (p.r + 14), p.y + Math.sin(a) * (p.r + 14),
        pointer.x, pointer.y,
        'rgba(110,231,255,' + (0.2 + 0.3 * (1 - Math.min(1, d / 640))) + ')', 2, [6, 8]
      );
    }
  }
  ctx.globalAlpha = 1;
}

function drawMines(t) {
  const cfg = BAL.enemies.miner;
  for (const m of mines) {
    const armed = m.arm <= 0;
    const fade = Math.max(0, Math.min(1, m.life * 2));
    ctx.save();
    ctx.translate(m.x, m.y);
    if (armed) {
      const pulse = 0.2 + 0.13 * (0.5 + 0.5 * Math.sin(t * 6 + m.x + m.y));
      ctx.globalAlpha = fade;
      ctx.fillStyle = 'rgba(255,74,48,' + pulse + ')';
      ctx.beginPath();
      ctx.arc(0, 0, cfg.mineTrigger, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = fade * (0.6 + 0.4 * Math.sin(t * 6));
      ctx.strokeStyle = '#ff8f6e';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(0, 0, 9, 0, TAU);
      ctx.stroke();
      ctx.fillStyle = '#ff5a3d';
      ctx.beginPath();
      ctx.arc(0, 0, 3.2, 0, TAU);
      ctx.fill();
    } else {
      ctx.globalAlpha = fade * (0.4 + 0.6 * Math.sin(t * 24));
      ctx.strokeStyle = '#ff9d6e';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 7, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = fade;
      ctx.fillStyle = '#ff9d6e';
      ctx.beginPath();
      ctx.arc(0, 0, 2.5, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }
}

function drawBeams() {
  if (!beams.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const b of beams) {
    const a = Math.max(0, b.life / b.max);
    ctx.strokeStyle = 'rgba(255,90,110,' + (0.85 * a) + ')';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(b.x1, b.y1);
    ctx.lineTo(b.x2, b.y2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,240,245,' + (0.95 * a) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(b.x1, b.y1);
    ctx.lineTo(b.x2, b.y2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawEnemies(t) {
  for (const e of enemies) {
    if (e.phase === 'spawn') {
      const k = 1 - e.t / BAL.pacing.spawnWarning;
      ctx.strokeStyle = 'rgba(255,110,140,' + (0.75 * (1 - k) + 0.15) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r + 26 * (1 - k), 0, TAU);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,90,122,0.5)';
      ctx.beginPath();
      ctx.arc(e.x, e.y, 4, 0, TAU);
      ctx.fill();
      continue;
    }
    let base = COL.rose;
    if (e.type === 'dasher') base = COL.violet;
    if (e.type === 'splitter') base = COL.green;
    if (e.type === 'spark') base = '#b6f2c4';
    if (e.type === 'shooter') base = COL.amber;
    if (e.type === 'miner') base = '#ff9d6e';
    if (e.type === 'shield') base = COL.cyan;
    if (e.type === 'bomber') base = '#ffa04d';
    if (e.type === 'sniper') base = '#cfd8ff';
    let alpha = 1;
    if (e.phase === 'telegraph') {
      alpha = 0.55 + 0.45 * Math.sin(t * 42);
      guideLine(e.x, e.y, e.x + e.dirx * 150, e.y + e.diry * 150, 'rgba(255,255,255,0.45)', 2, [6, 6]);
    }
    if (e.type === 'shooter' && e.phase === 'aim') {
      alpha = 0.6 + 0.4 * Math.sin(t * 30);
      guideLine(e.x, e.y, player.x, player.y, 'rgba(255,209,102,0.4)', 1, [3, 8]);
    }
    if (e.type === 'sniper' && e.phase === 'aim') {
      alpha = 0.6 + 0.4 * Math.sin(t * 22);
      guideLine(e.x, e.y, e.x + e.dirx * BAL.enemies.sniper.range, e.y + e.diry * BAL.enemies.sniper.range, 'rgba(255,90,110,0.35)', 2, [10, 8]);
    }
    if (e.type === 'dasher' && e.phase === 'dash') {
      ctx.strokeStyle = 'rgba(177,140,255,0.35)';
      ctx.lineWidth = e.r * 1.7;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(e.x - e.vx * 0.055, e.y - e.vy * 0.055);
      ctx.lineTo(e.x, e.y);
      ctx.stroke();
      ctx.lineCap = 'butt';
    }
    if (e.type === 'shield') {
      const cfg = BAL.enemies.shield;
      const broken = e.broken > 0;
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.rotate(e.ang);
      ctx.strokeStyle = broken ? 'rgba(110,231,255,0.18)' : e.flash > 0 ? '#eaffff' : 'rgba(110,231,255,0.72)';
      ctx.lineWidth = broken ? 2 : 5;
      if (broken) ctx.setLineDash([4, 7]);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(0, 0, e.r + 8, -cfg.arc / 2, cfg.arc / 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.lineCap = 'butt';
      ctx.restore();
    }
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = base;
    ctx.shadowBlur = 14;
    ctx.fillStyle = base;
    const ang = Math.atan2(player.y - e.y, player.x - e.x);
    ctx.translate(e.x, e.y);
    ctx.rotate(ang);
    ctx.fillStyle = 'rgba(4,8,14,0.5)';
    ctx.beginPath();
    ctx.arc(0, 0, e.r + 2.5, 0, TAU);
    ctx.fill();
    ctx.fillStyle = base;
    if (e.type === 'dasher') {
      ctx.beginPath();
      ctx.moveTo(e.r * 1.3, 0);
      ctx.lineTo(-e.r * 0.9, e.r);
      ctx.lineTo(-e.r * 0.9, -e.r);
      ctx.closePath();
      ctx.fill();
    } else if (e.type === 'splitter') {
      ctx.beginPath();
      ctx.arc(0, 0, e.r, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = '#0a1524';
      ctx.beginPath();
      ctx.arc(-e.r * 0.35, 0, e.r * 0.3, 0, TAU);
      ctx.arc(e.r * 0.35, 0, e.r * 0.3, 0, TAU);
      ctx.fill();
    } else if (e.type === 'shooter') {
      ctx.beginPath();
      ctx.moveTo(e.r * 1.25, 0);
      ctx.lineTo(-e.r * 0.8, e.r * 0.8);
      ctx.lineTo(-e.r * 0.8, -e.r * 0.8);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,209,102,0.55)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(e.r * 1.25, 0);
      ctx.lineTo(e.r * 2.1, 0);
      ctx.stroke();
    } else if (e.type === 'sniper') {
      ctx.beginPath();
      ctx.arc(0, 0, e.r * 0.85, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(e.r * 0.7, 0);
      ctx.lineTo(e.r * 2.6, 0);
      ctx.stroke();
    } else if (e.type === 'bomber') {
      ctx.beginPath();
      ctx.arc(0, 0, e.r, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#3a1408';
      ctx.beginPath();
      ctx.arc(0, 0, e.r * 0.55, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#ffd9a8';
      ctx.beginPath();
      ctx.arc(0, 0, e.r * (0.22 + 0.1 * Math.sin(t * 14 + e.seed)), 0, TAU);
      ctx.fill();
    } else if (e.type === 'shield') {
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = i * TAU / 6;
        const x = Math.cos(a) * e.r, y = Math.sin(a) * e.r;
        if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#0a1a24';
      ctx.beginPath();
      ctx.arc(0, 0, e.r * 0.36, 0, TAU);
      ctx.fill();
    } else if (e.type === 'miner') {
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = i * TAU / 8;
        const rr = i % 2 ? e.r * 0.76 : e.r;
        const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
        if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#2a1208';
      ctx.beginPath();
      ctx.arc(0, 0, e.r * 0.4, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#ffd2b0';
      ctx.beginPath();
      ctx.arc(e.r * 0.66, 0, 2.6, 0, TAU);
      ctx.fill();
    } else if (e.type === 'spark') {
      ctx.beginPath();
      ctx.moveTo(e.r * 1.4, 0);
      ctx.lineTo(-e.r, e.r * 0.8);
      ctx.lineTo(-e.r, -e.r * 0.8);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(0, 0, e.r, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,90,122,0.55)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 6; i++) {
        const a = t * 0.9 + i * TAU / 6;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * e.r, Math.sin(a) * e.r);
        ctx.lineTo(Math.cos(a) * (e.r + 5), Math.sin(a) * (e.r + 5));
        ctx.stroke();
      }
    }
    ctx.restore();

    ctx.fillStyle = 'rgba(10,15,27,0.85)';
    ctx.beginPath();
    ctx.arc(e.x + Math.cos(ang) * e.r * 0.22, e.y + Math.sin(ang) * e.r * 0.22, Math.max(2.5, e.r * 0.28), 0, TAU);
    ctx.fill();
  }
}

function drawBoss(t) {
  const b = boss;
  if (!b) return;
  if (b.spawnT > 0) {
    const k = 1 - b.spawnT / 1.2;
    ctx.globalAlpha = 0.8 * (1 - k) + 0.2;
    ctx.strokeStyle = b.color || COL.boss;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 60 + 180 * (1 - k), 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = b.color || COL.boss;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 8, 0, TAU);
    ctx.fill();
    const im = IMG[(b.name || 'CORE').toLowerCase()];
    if (imgReady(im)) {
      const sc = 0.7 + 0.55 * k;
      ctx.save();
      ctx.globalAlpha = Math.min(1, 0.35 + k);
      ctx.translate(b.x, b.y);
      ctx.rotate((1 - k) * 0.5);
      ctx.drawImage(im, -b.r * sc, -b.r * sc, b.r * 2 * sc, b.r * 2 * sc);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    return;
  }
  const base = b.enraged ? '#ff2d55' : (b.color || COL.boss);
  ctx.save();
  ctx.shadowColor = base;
  ctx.shadowBlur = 28;
  ctx.strokeStyle = base;
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = b.ang + i * TAU / 6;
    const x = b.x + Math.cos(a) * b.r, y = b.y + Math.sin(a) * b.r;
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
  ctx.closePath();
  ctx.stroke();

  ctx.lineWidth = 1.5;
  ctx.globalAlpha = 0.6;
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = -b.ang * 1.4 + i * TAU / 6;
    const x = b.x + Math.cos(a) * (b.r + 10), y = b.y + Math.sin(a) * (b.r + 10);
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
  ctx.closePath();
  ctx.stroke();
  ctx.restore();

  ctx.fillStyle = b.flash > 0 ? '#ffe3ea' : 'rgba(24,8,16,0.92)';
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r * 0.62, 0, TAU);
  ctx.fill();

  ctx.fillStyle = b.flash > 0 ? '#ffffff' : base;
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r * 0.26, 0, TAU);
  ctx.fill();

  if (b.charge > 0) {
    const k = 1 - b.charge / b.cfg.charge;
    ctx.strokeStyle = 'rgba(255,138,216,' + (0.4 + 0.5 * k) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r + 22 - 12 * k, 0, TAU);
    ctx.stroke();
  }
}

function drawShots() {
  for (const s of shots) {
    ctx.save();
    ctx.shadowColor = COL.shot;
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#ffd6f2';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,138,216,0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(s.x - s.vx * 0.03, s.y - s.vy * 0.03);
    ctx.lineTo(s.x, s.y);
    ctx.stroke();
  }
}

function drawBullet() {
  const b = bullet;
  if (!b) return;
  if (b.state === 'pull') {
    ctx.strokeStyle = 'rgba(110,231,255,0.7)';
    ctx.lineWidth = b.r * 1.8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(b.x - b.vx * 0.02, b.y - b.vy * 0.02);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    ctx.lineCap = 'butt';
    ctx.save();
    ctx.shadowColor = COL.cyan;
    ctx.shadowBlur = 18;
    ctx.fillStyle = '#eaf7ff';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,209,102,0.4)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(b.tx - 7, b.ty); ctx.lineTo(b.tx + 7, b.ty);
    ctx.moveTo(b.tx, b.ty - 7); ctx.lineTo(b.tx, b.ty + 7);
    ctx.stroke();
    return;
  }
  if (b.state === 'fly' || b.state === 'bounce') {
    ctx.save();
    ctx.lineCap = 'round';
    for (let i = 1; i <= 4; i++) {
      const k = i * 0.011;
      ctx.globalAlpha = 0.55 / i;
      ctx.strokeStyle = i === 1 ? '#ffe6a8' : 'rgba(255,209,102,0.8)';
      ctx.lineWidth = b.r * (1.8 - i * 0.3);
      ctx.beginPath();
      ctx.moveTo(b.x - b.vx * k * 0.45, b.y - b.vy * k * 0.45);
      ctx.lineTo(b.x - b.vx * k, b.y - b.vy * k);
      ctx.stroke();
    }
    ctx.restore();
    ctx.save();
    ctx.shadowColor = COL.amber;
    ctx.shadowBlur = 18;
    ctx.fillStyle = '#fff3cf';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.fill();
    ctx.restore();
  } else {
    const t = performance.now() / 1000;
    const pulse = 0.5 + 0.5 * Math.sin(t * 6);
    ctx.strokeStyle = 'rgba(255,209,102,' + (0.35 + 0.45 * pulse) + ')';
    ctx.lineWidth = 2;
    ctx.setLineDash([7, 9]);
    ctx.lineDashOffset = -t * 26;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 16 + pulse * 4, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
    if (player) {
      const ang = Math.atan2(b.y - player.y, b.x - player.x);
      const ex = b.x - Math.cos(ang) * 22;
      const ey = b.y - Math.sin(ang) * 22;
      guideLine(player.x, player.y, ex, ey, 'rgba(255,209,102,0.5)', 2, [7, 7]);
    }
    ctx.save();
    ctx.shadowColor = COL.amber;
    ctx.shadowBlur = 16;
    ctx.fillStyle = COL.amber;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawPopups() {
  ctx.textAlign = 'center';
  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, p.life / (p.max * 0.6));
    ctx.fillStyle = p.color;
    ctx.font = '700 ' + p.size + 'px ' + FONT;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

function heart(cx, cy, r, filled) {
  ctx.beginPath();
  ctx.moveTo(cx, cy - r);
  ctx.lineTo(cx + r, cy);
  ctx.lineTo(cx, cy + r);
  ctx.lineTo(cx - r, cy);
  ctx.closePath();
  if (filled) {
    ctx.fillStyle = COL.cyan;
    ctx.fill();
  } else {
    ctx.strokeStyle = 'rgba(110,231,255,0.35)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

function drawPullIcon() {
  if (state !== 'play' && state !== 'pause') return;
  const cx = W / 2, cy = H - 50, r = 18;
  const ready = pullCd <= 0;
  const usable = ready && bullet && bullet.state === 'ground';

  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, TAU);
  ctx.fillStyle = 'rgba(6,10,20,0.82)';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = usable ? 'rgba(110,231,255,0.85)' : ready ? 'rgba(159,182,216,0.35)' : 'rgba(255,209,102,0.5)';
  ctx.stroke();

  ctx.save();
  ctx.globalAlpha = usable ? 1 : 0.45;
  if (imgReady(IMG.pull)) {
    ctx.beginPath();
    ctx.arc(cx, cy, r - 2, 0, TAU);
    ctx.clip();
    ctx.drawImage(IMG.pull, cx - r, cy - r, r * 2, r * 2);
  } else {
    ctx.strokeStyle = COL.cyan;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx + 7, cy);
    ctx.lineTo(cx - 6, cy);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - 6, cy);
    ctx.lineTo(cx - 1, cy - 5);
    ctx.moveTo(cx - 6, cy);
    ctx.lineTo(cx - 1, cy + 5);
    ctx.stroke();
    ctx.fillStyle = COL.amber;
    ctx.beginPath();
    ctx.arc(cx + 7, cy, 3, 0, TAU);
    ctx.fill();
  }
  ctx.restore();

  if (!ready) {
    const frac = Math.min(1, pullCd / BAL.abilities.pull.cooldown);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r - 1, -Math.PI / 2, -Math.PI / 2 + TAU * frac);
    ctx.closePath();
    ctx.fillStyle = 'rgba(4,6,12,0.78)';
    ctx.fill();
    ctx.fillStyle = '#dbe6ff';
    ctx.font = '700 13px ' + FONT;
    ctx.textAlign = 'center';
    ctx.fillText(String(Math.ceil(pullCd)), cx, cy + 5);
  }

  ctx.beginPath();
  ctx.arc(cx + r - 2, cy - r + 2, 7, 0, TAU);
  ctx.fillStyle = '#0a0f1b';
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,170,255,0.4)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = 'rgba(219,230,255,0.85)';
  ctx.font = '700 9px ' + FONT;
  ctx.textAlign = 'center';
  ctx.fillText('1', cx + r - 2, cy - r + 5);
  ctx.fillStyle = 'rgba(159,182,216,0.5)';
  ctx.font = '700 8px ' + FONT;
  ctx.textAlign = 'center';
  ctx.fillText('PULL', cx, cy + 28);
}

function drawDetonateIcon() {
  if (state !== 'play' && state !== 'pause') return;
  const cx = W / 2 + 58, cy = H - 50, r = 18;
  const ready = detonateCd <= 0;
  const usable = ready && bullet && bullet.state === 'ground';

  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, TAU);
  ctx.fillStyle = 'rgba(6,10,20,0.82)';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = usable ? 'rgba(255,90,122,0.9)' : ready ? 'rgba(159,182,216,0.35)' : 'rgba(255,209,102,0.5)';
  ctx.stroke();

  ctx.save();
  ctx.globalAlpha = usable ? 1 : 0.45;
  if (imgReady(IMG.blast)) {
    ctx.beginPath();
    ctx.arc(cx, cy, r - 2, 0, TAU);
    ctx.clip();
    ctx.drawImage(IMG.blast, cx - r, cy - r, r * 2, r * 2);
  } else {
    ctx.strokeStyle = COL.rose;
    ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const a = i * TAU / 6 + Math.PI / 6;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * 3, cy + Math.sin(a) * 3);
      ctx.lineTo(cx + Math.cos(a) * 9, cy + Math.sin(a) * 9);
      ctx.stroke();
    }
    ctx.fillStyle = COL.rose;
    ctx.beginPath();
    ctx.arc(cx, cy, 2.6, 0, TAU);
    ctx.fill();
  }
  ctx.restore();

  if (!ready) {
    const frac = Math.min(1, detonateCd / BAL.abilities.detonate.cooldown);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r - 1, -Math.PI / 2, -Math.PI / 2 + TAU * frac);
    ctx.closePath();
    ctx.fillStyle = 'rgba(4,6,12,0.78)';
    ctx.fill();
    ctx.fillStyle = '#dbe6ff';
    ctx.font = '700 13px ' + FONT;
    ctx.textAlign = 'center';
    ctx.fillText(String(Math.ceil(detonateCd)), cx, cy + 5);
  }

  ctx.beginPath();
  ctx.arc(cx + r - 2, cy - r + 2, 7, 0, TAU);
  ctx.fillStyle = '#0a0f1b';
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,170,255,0.4)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = 'rgba(219,230,255,0.85)';
  ctx.font = '700 9px ' + FONT;
  ctx.textAlign = 'center';
  ctx.fillText('2', cx + r - 2, cy - r + 5);
  ctx.fillStyle = 'rgba(159,182,216,0.5)';
  ctx.font = '700 8px ' + FONT;
  ctx.textAlign = 'center';
  ctx.fillText('BLAST', cx, cy + 28);
}

function drawHUD() {
  if (state === 'menu' || state === 'settings' || state === 'controls') return;
  ctx.save();
  ctx.fillStyle = 'rgba(6,10,20,0.42)';
  rrect(14, 14, 150, 114, 12);
  ctx.fill();
  ctx.strokeStyle = 'rgba(110,231,255,0.10)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = 'rgba(6,10,20,0.42)';
  rrect(W - 214, 14, 200, 112, 12);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,209,102,0.10)';
  ctx.stroke();
  ctx.restore();

  ctx.textAlign = 'left';
  ctx.fillStyle = COL.dim;
  ctx.font = '600 13px ' + FONT;
  ctx.fillText('WAVE', 28, 36);
  ctx.fillStyle = COL.text;
  ctx.font = '700 28px ' + FONT;
  ctx.fillText(String(Math.max(1, wave)).padStart(2, '0'), 28, 66);

  for (let i = 0; i < player.maxHp; i++) heart(34 + i * 24, 96, 7, i < player.hp);
  if (waveMod) {
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,209,102,0.85)';
    ctx.font = '700 12px ' + FONT;
    ctx.fillText(waveMod.id, 28, 124);
  }

  ctx.textAlign = 'right';
  ctx.fillStyle = COL.dim;
  ctx.font = '600 13px ' + FONT;
  ctx.fillText('SCORE', W - 28, 36);
  ctx.fillStyle = COL.text;
  ctx.font = '700 28px ' + FONT;
  ctx.fillText(String(score), W - 28, 66);
  ctx.fillStyle = COL.faint;
  ctx.font = '600 12px ' + FONT;
  ctx.fillText('BEST ' + S.best + ' · WAVE ' + (S.bestWave || 0), W - 28, 88);
  if (style > 1) {
    ctx.fillStyle = COL.cyan;
    ctx.font = '700 16px ' + FONT;
    ctx.fillText('x' + style + ' STYLE', W - 28, 112);
  }

  if (boss) {
    const bw = 440, bx = W / 2 - bw / 2, by = 30;
    ctx.textAlign = 'center';
    ctx.fillStyle = boss.color || 'rgba(255,143,166,0.85)';
    ctx.font = '700 12px ' + FONT;
    ctx.fillText(boss.name || 'CORE', W / 2, 22);
    ctx.fillStyle = 'rgba(255,77,109,0.18)';
    ctx.fillRect(bx, by, bw, 10);
    ctx.fillStyle = boss.enraged ? '#ff2d55' : (boss.color || COL.boss);
    ctx.fillRect(bx, by, bw * Math.max(0, boss.hp) / boss.maxHp, 10);
    ctx.strokeStyle = 'rgba(255,143,166,0.5)';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, 9);
  }

  const has = player.has;
  const pulse = 0.55 + 0.4 * Math.sin(performance.now() / 240);
  if (state !== 'dead') {
    ctx.textAlign = 'left';
    ctx.font = '600 13px ' + FONT;
    if (!has) {
      ctx.strokeStyle = 'rgba(255,209,102,' + pulse + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(35, H - 31, 8, 0, TAU);
      ctx.stroke();
    }
    ctx.fillStyle = has ? COL.amber : 'rgba(255,209,102,' + pulse + ')';
    ctx.beginPath();
    ctx.arc(35, H - 31, 5, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(219,230,255,0.82)';
    const ammoLabel = has ? 'AMMO IN HAND'
      : bullet && bullet.state === 'pull' ? 'AMMO RETURNING'
      : bullet && bullet.state === 'bounce' ? 'AMMO BOUNCING'
      : bullet && bullet.state === 'fly' ? 'AMMO IN FLIGHT'
      : 'AMMO ON GROUND';
    ctx.fillText(ammoLabel, 52, H - 26);
  }

  if (state === 'play') {
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(159,182,216,0.42)';
    ctx.font = '600 13px ' + FONT;
    ctx.fillText('P / Esc — pause · M — sound', W - 28, H - 26);
  }
  drawPullIcon();
  drawDetonateIcon();
}

function drawHint() {
  if (state !== 'play' || !hint) return;
  const a = Math.min(1, hint.life / 0.8);
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '600 16px ' + FONT;
  const tw = ctx.measureText(hint.text).width;
  const x = W / 2 - tw / 2 - 18;
  const y = H - 112;
  rrect(x, y, tw + 36, 36, 8);
  ctx.fillStyle = 'rgba(6,10,20,0.8)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(110,231,255,0.18)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = '#cfe4ff';
  ctx.fillText(hint.text, W / 2, y + 23);
  ctx.globalAlpha = 1;
}

function drawVignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, 260, W / 2, H / 2, 720);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  if (state === 'play' && player && player.hp === 1) {
    const t = performance.now() / 1000;
    const a = 0.1 + 0.06 * (0.5 + 0.5 * Math.sin(t * 6));
    const r = ctx.createRadialGradient(W / 2, H / 2, 240, W / 2, H / 2, 720);
    r.addColorStop(0, 'rgba(255,40,80,0)');
    r.addColorStop(1, 'rgba(255,40,80,' + a + ')');
    ctx.fillStyle = r;
    ctx.fillRect(0, 0, W, H);
  }
}

function overlay(alpha) {
  ctx.fillStyle = 'rgba(3,5,11,' + alpha + ')';
  ctx.fillRect(0, 0, W, H);
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) {
    ctx.roundRect(x, y, w, h, r);
    return;
  }
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function panel(x, y, w, h) {
  rrect(x, y, w, h, 14);
  ctx.fillStyle = 'rgba(8,13,24,0.96)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,170,255,0.22)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function inRect(px, py, x, y, w, h) {
  return px >= x && px <= x + w && py >= y && py <= y + h;
}

function addButton(id, x, y, w, h, label, onClick, opts) {
  opts = opts || {};
  ui.items.push({ kind: 'button', id, x, y, w, h, label, onClick, primary: !!opts.primary, small: !!opts.small });
}

function addSlider(id, labelX, label, x, y, w, h, get, set) {
  ui.items.push({ kind: 'slider', id, labelX, label, x, y, w, h, get, set });
}

function addToggle(id, labelX, label, x, y, w, h, get, set) {
  ui.items.push({ kind: 'toggle', id, labelX, label, x, y, w, h, get, set });
}

function drawButton(it) {
  const f = ui.items[ui.focus] === it;
  rrect(it.x, it.y, it.w, it.h, 10);
  ctx.fillStyle = it.primary ? 'rgba(255,209,102,0.10)' : (f ? 'rgba(110,231,255,0.12)' : 'rgba(10,16,30,0.62)');
  ctx.fill();
  ctx.strokeStyle = it.primary ? 'rgba(255,209,102,0.75)' : (f ? COL.cyan : 'rgba(120,170,255,0.26)');
  ctx.lineWidth = f || it.primary ? 2 : 1;
  ctx.stroke();
  ctx.textAlign = 'center';
  ctx.fillStyle = it.primary ? COL.amber : (f ? '#ffffff' : 'rgba(219,230,255,0.88)');
  ctx.font = (it.small ? '700 12px ' : '700 15px ') + FONT;
  ctx.fillText(it.label, it.x + it.w / 2, it.y + it.h / 2 + 5);
}

function drawSlider(it) {
  const f = ui.items[ui.focus] === it;
  const v = clamp(it.get(), 0, 100);
  const cy = it.y + it.h / 2;
  ctx.textAlign = 'left';
  ctx.fillStyle = f ? '#ffffff' : COL.text;
  ctx.font = '600 15px ' + FONT;
  ctx.fillText(it.label, it.labelX, cy + 5);
  rrect(it.x, cy - 4, it.w, 8, 4);
  ctx.fillStyle = 'rgba(120,170,255,0.16)';
  ctx.fill();
  rrect(it.x, cy - 4, Math.max(8, it.w * v / 100), 8, 4);
  ctx.fillStyle = COL.cyan;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(it.x + it.w * v / 100, cy, 7, 0, TAU);
  ctx.fillStyle = '#eaf7ff';
  ctx.fill();
  if (f) {
    ctx.strokeStyle = 'rgba(110,231,255,0.7)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(it.x + it.w * v / 100, cy, 10, 0, TAU);
    ctx.stroke();
  }
  ctx.textAlign = 'right';
  ctx.fillStyle = COL.dim;
  ctx.font = '600 13px ' + FONT;
  ctx.fillText(v + '%', it.x + it.w + 44, cy + 4);
}

function drawToggle(it) {
  const f = ui.items[ui.focus] === it;
  const on = !!it.get();
  ctx.textAlign = 'left';
  ctx.fillStyle = f ? '#ffffff' : COL.text;
  ctx.font = '600 15px ' + FONT;
  ctx.fillText(it.label, it.labelX, it.y + 19);
  rrect(it.x, it.y, it.w, it.h, it.h / 2);
  ctx.fillStyle = on ? 'rgba(110,231,255,0.18)' : 'rgba(120,170,255,0.1)';
  ctx.fill();
  ctx.strokeStyle = f ? COL.cyan : (on ? 'rgba(110,231,255,0.6)' : 'rgba(120,170,255,0.3)');
  ctx.lineWidth = f ? 2 : 1;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(on ? it.x + it.w - it.h / 2 : it.x + it.h / 2, it.y + it.h / 2, it.h / 2 - 4, 0, TAU);
  ctx.fillStyle = on ? COL.cyan : 'rgba(159,182,216,0.6)';
  ctx.fill();
  ctx.textAlign = 'center';
  ctx.font = '700 11px ' + FONT;
  ctx.fillStyle = on ? '#04202a' : 'rgba(219,230,255,0.6)';
  ctx.fillText(on ? 'ON' : 'OFF', it.x + it.w / 2, it.y + it.h / 2 + 4);
}

function layoutUI() {
  ui.items = [];
  if (state === 'menu') {
    addButton('play', W / 2 - 150, 300, 300, 56, 'PLAY', startRun, { primary: true });
    addButton('settings', W / 2 - 150, 372, 300, 48, 'SETTINGS', () => openSettings('menu'));
    addButton('controls', W / 2 - 150, 434, 300, 48, 'CONTROLS', () => openControls('menu'));
  } else if (state === 'settings') {
    const px = 252, py = 60, pw = 520, ph = 520;
    addSlider('vol', px + 28, 'Volume', px + 300, py + 76, 180, 20, () => S.volume, v => {
      S.volume = v;
      if (v > 0) lastVol = v;
      applyVolume();
      saveSettings();
    });
    addSlider('music', px + 28, 'Music', px + 300, py + 132, 180, 20, () => S.music, v => {
      S.music = v;
      applyVolume();
      saveSettings();
    });
    addSlider('sfx', px + 28, 'Effects', px + 300, py + 188, 180, 20, () => S.sfx, v => {
      S.sfx = v;
      applyVolume();
      saveSettings();
    });
    addToggle('shake', px + 28, 'Screen shake', px + 396, py + 250, 84, 28, () => S.shake, v => {
      S.shake = v;
      saveSettings();
    });
    addToggle('hints', px + 28, 'Hints', px + 396, py + 312, 84, 28, () => S.hints, v => {
      S.hints = v;
      saveSettings();
    });
    addButton('reset', px + 300, py + 370, 200, 36, 'RESET BEST', () => {
      S.best = 0;
      saveSettings();
      live('Best score reset.');
    }, { small: true });
    addButton('back', px + 160, py + ph - 64, 200, 44, 'BACK', back);
  } else if (state === 'controls') {
    const px = 252, py = 110, pw = 520, ph = 430;
    addButton('back', px + 160, py + ph - 64, 200, 44, 'BACK', back);
  } else if (state === 'pause') {
    addButton('resume', W / 2 - 140, 300, 280, 46, 'RESUME', resumeGame, { primary: true });
    addButton('settings', W / 2 - 140, 356, 280, 46, 'SETTINGS', () => openSettings('pause'));
    addButton('restart', W / 2 - 140, 412, 280, 46, 'RESTART', startRun);
    addButton('menu', W / 2 - 140, 468, 280, 46, 'MAIN MENU', toMenu);
  } else if (state === 'dead') {
    addButton('retry', W / 2 - 140, 430, 280, 46, 'TRY AGAIN', startRun, { primary: true });
    addButton('menu', W / 2 - 140, 486, 280, 46, 'MAIN MENU', toMenu);
  }
  const max = ui.items.length - 1;
  if (ui.focus > max) ui.focus = 0;
  if (ui.focus < 0) ui.focus = 0;
}

function drawUIItems() {
  for (const it of ui.items) {
    if (it.kind === 'button') drawButton(it);
    else if (it.kind === 'slider') drawSlider(it);
    else if (it.kind === 'toggle') drawToggle(it);
  }
}

function updateHover() {
  if (!pointer.has) return;
  for (let i = 0; i < ui.items.length; i++) {
    const it = ui.items[i];
    if (inRect(pointer.x, pointer.y, it.x, it.y, it.w, it.h)) {
      ui.focus = i;
      return;
    }
  }
}

function sliderAt(px, py) {
  for (const it of ui.items) {
    if (it.kind === 'slider' && inRect(px, py, it.x, it.y, it.w, it.h)) return it;
  }
  return null;
}

function setSlider(it) {
  const v = Math.round(clamp((pointer.x - it.x) / it.w, 0, 1) * 20) * 5;
  if (v === it.get()) return;
  it.set(v);
  sfx.tick();
}

function activate(it) {
  if (!it) return;
  if (it.kind === 'button') {
    sfx.ui();
    it.onClick();
  } else if (it.kind === 'toggle') {
    sfx.toggle();
    it.set(!it.get());
  } else if (it.kind === 'slider') {
    if (inRect(pointer.x, pointer.y, it.x, it.y, it.w, it.h)) setSlider(it);
  }
}

function clickUI() {
  for (let i = ui.items.length - 1; i >= 0; i--) {
    const it = ui.items[i];
    if (inRect(pointer.x, pointer.y, it.x, it.y, it.w, it.h)) {
      activate(it);
      return;
    }
  }
}

function openSettings(from) {
  prevState = from;
  state = 'settings';
  ui.focus = 0;
}

function openControls(from) {
  prevState = from;
  state = 'controls';
  ui.focus = 0;
}

function toMenu() {
  resetRun();
  state = 'menu';
  ui.focus = 0;
  setDuck(0.8);
}

function pauseGame() {
  if (state !== 'play') return;
  state = 'pause';
  ui.focus = 0;
  setDuck(0.35);
  sfx.pause();
  live('Paused.');
}

function resumeGame() {
  if (state !== 'pause') return;
  state = 'play';
  lastTime = performance.now();
  acc = 0;
  setDuck(1);
  sfx.resume();
}

function back() {
  if (state === 'settings' || state === 'controls') {
    state = prevState;
    ui.focus = 0;
  } else if (state === 'pause') {
    resumeGame();
  } else if (state === 'dead') {
    toMenu();
  }
}

function toggleMute() {
  if (S.volume > 0) {
    lastVol = S.volume;
    S.volume = 0;
  } else {
    S.volume = lastVol || 60;
  }
  applyVolume();
  saveSettings();
  live(S.volume ? 'Sound on.' : 'Sound off.');
}

function drawMenu(t) {
  overlay(0.62);
  ctx.textAlign = 'center';
  ctx.save();
  ctx.shadowColor = 'rgba(110,231,255,0.55)';
  ctx.shadowBlur = 24 + 8 * Math.sin(t * 1.8);
  const tg = ctx.createLinearGradient(W / 2 - 250, 120, W / 2 + 250, 200);
  tg.addColorStop(0, '#eaf7ff');
  tg.addColorStop(0.5, '#9fe8ff');
  tg.addColorStop(1, '#6ee7ff');
  ctx.fillStyle = tg;
  ctx.font = '800 76px ' + FONT;
  ctx.fillText('ONE BULLET', W / 2, 176);
  ctx.restore();

  ctx.fillStyle = 'rgba(110,231,255,' + (0.35 + 0.2 * Math.sin(t * 1.8)) + ')';
  ctx.fillRect(W / 2 - 74, 196, 148, 2);

  ctx.fillStyle = 'rgba(159,182,216,0.72)';
  ctx.font = '600 13px ' + FONT;
  ctx.fillText('ONE SHOT · ENDLESS WAVES', W / 2, 222);

  ctx.fillStyle = 'rgba(159,182,216,0.7)';
  ctx.font = '600 14px ' + FONT;
  ctx.fillText('Best score: ' + S.best + ' · Best wave: ' + (S.bestWave || 0), W / 2, 528);
}

function drawSettings() {
  overlay(0.7);
  const px = 252, py = 60, pw = 520, ph = 520;
  panel(px, py, pw, ph);
  ctx.textAlign = 'left';
  ctx.fillStyle = COL.text;
  ctx.font = '800 24px ' + FONT;
  ctx.fillText('SETTINGS', px + 28, py + 44);
}

function drawControls() {
  overlay(0.7);
  const px = 252, py = 110, pw = 520, ph = 430;
  panel(px, py, pw, ph);
  ctx.textAlign = 'left';
  ctx.fillStyle = COL.text;
  ctx.font = '800 24px ' + FONT;
  ctx.fillText('CONTROLS', px + 28, py + 44);

  const rows = [
    ['Move', 'W A S D / arrows'],
    ['Shoot', 'LMB / Space'],
    ['Pull ammo', '1'],
    ['Detonate ammo', '2 (ammo on the ground)'],
    ['Pause', 'P / Esc'],
    ['Sound', 'M'],
    ['Restart', 'R on the death screen'],
    ['Ammo pickup', 'walk over it']
  ];
  ctx.font = '600 15px ' + FONT;
  rows.forEach((r, i) => {
    const y = py + 92 + i * 34;
    ctx.fillStyle = 'rgba(159,182,216,0.75)';
    ctx.fillText(r[0], px + 28, y);
    ctx.textAlign = 'right';
    ctx.fillStyle = COL.text;
    ctx.fillText(r[1], px + pw - 28, y);
    ctx.textAlign = 'left';
  });
  ctx.fillStyle = 'rgba(159,182,216,0.45)';
  ctx.font = '600 12px ' + FONT;
  ctx.fillText('The bullet is the only ammo — keep track of it', px + 28, py + ph - 92);
}

function drawPause() {
  overlay(0.66);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#eaf7ff';
  ctx.font = '800 54px ' + FONT;
  ctx.fillText('PAUSED', W / 2, 240);
}

function drawDead() {
  overlay(0.74);
  ctx.textAlign = 'center';
  ctx.save();
  ctx.shadowColor = 'rgba(255,90,122,0.5)';
  ctx.shadowBlur = 22;
  ctx.fillStyle = '#ffd9e2';
  ctx.font = '800 56px ' + FONT;
  ctx.fillText('CAUGHT', W / 2, 236);
  ctx.restore();

  ctx.fillStyle = 'rgba(219,230,255,0.92)';
  ctx.font = '700 22px ' + FONT;
  ctx.fillText('WAVE ' + wave + ' · SCORE ' + score, W / 2, 300);
  ctx.fillStyle = 'rgba(159,182,216,0.72)';
  ctx.font = '600 15px ' + FONT;
  ctx.fillText('Best ' + S.best + ' · Best wave ' + (S.bestWave || 0) + ' · Time ' + fmtTime(runTime), W / 2, 334);
  if (styleBonus > 0) {
    ctx.fillStyle = 'rgba(110,231,255,0.8)';
    ctx.font = '600 15px ' + FONT;
    ctx.fillText('Style bonus +' + styleBonus + ' · best x' + styleMax, W / 2, 362);
  }
}

function draw() {
  const t = performance.now() / 1000;
  layoutUI();
  updateHover();

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#04060c';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(view.s, 0, 0, view.s, view.ox, view.oy);

  ctx.save();
  if (shake > 0 && S.shake) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }
  drawArena();
  drawRings();
  drawMines(t);
  drawBeams();
  drawEnemies(t);
  drawBoss(t);
  drawShots();
  drawBullet();
  if (state === 'play' || state === 'pause') drawPlayer(t);
  drawParticles();
  drawPopups();
  ctx.restore();

  drawHUD();
  drawHint();
  drawVignette();

  if (state === 'menu') drawMenu(t);
  else if (state === 'settings') drawSettings();
  else if (state === 'controls') drawControls();
  else if (state === 'pause') drawPause();
  else if (state === 'dead') drawDead();

  if (flash > 0 && state === 'play') {
    ctx.fillStyle = 'rgba(255,60,90,' + (flash * 0.22) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  drawUIItems();
}

function frame(now) {
  const raw = (now - lastTime) / 1000;
  lastTime = now;
  const dt = Math.min(0.1, Math.max(0, raw));
  if (state === 'play') {
    acc += dt;
    let guard = 0;
    while (acc >= STEP && guard < 10) {
      update(STEP);
      acc -= STEP;
      guard++;
    }
    if (guard >= 10) acc = 0;
  } else if (state === 'dying') {
    dyingT += dt;
    updateFx(dt * 0.5);
    if (dyingT > 1.0) finishDeath();
  } else {
    acc = 0;
    updateFx(dt);
  }
  draw();
  window.requestAnimationFrame(frame);
}

canvas.addEventListener('mousemove', (e) => {
  setPointer(e);
  if (dragSlider) setSlider(dragSlider);
});

canvas.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  e.preventDefault();
  setPointer(e);
  canvas.focus();
  ensureAudio();
  startMusic();
  suppressClick = false;
  if (state === 'settings') {
    const it = sliderAt(pointer.x, pointer.y);
    if (it) {
      dragSlider = it;
      setSlider(it);
      return;
    }
  }
  if (state === 'play') shoot();
});

canvas.addEventListener('click', (e) => {
  if (e.button !== 0) return;
  setPointer(e);
  if (suppressClick) { suppressClick = false; return; }
  clickUI();
});

window.addEventListener('mouseup', () => {
  if (dragSlider) {
    dragSlider = null;
    suppressClick = true;
  }
});

window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const code = e.code;
  if (code === 'Space' || code.indexOf('Arrow') === 0) e.preventDefault();
  ensureAudio();
  startMusic();

  if (code === 'Escape') {
    if (state === 'play') pauseGame();
    else back();
    return;
  }
  if (code === 'KeyM') { toggleMute(); return; }

  if (state === 'play') {
    if (code === 'KeyP') { pauseGame(); return; }
    if (code === 'Space') { shoot(); return; }
    if (code === 'Digit1' || code === 'Numpad1') { usePull(); return; }
    if (code === 'Digit2' || code === 'Numpad2') { useDetonate(); return; }
    keys.add(code);
    return;
  }

  if (state === 'pause') {
    if (code === 'KeyP') { resumeGame(); return; }
    if (code === 'KeyR') { startRun(); return; }
  }

  if (state === 'dead') {
    if (code === 'KeyR' || code === 'Enter' || code === 'Space') { startRun(); return; }
  }

  if (state === 'menu' && (code === 'Enter' || code === 'Space')) { startRun(); return; }

  if (code === 'ArrowUp') { moveFocus(-1); return; }
  if (code === 'ArrowDown') { moveFocus(1); return; }
  if (code === 'ArrowLeft' || code === 'ArrowRight') {
    if (adjustFocused(code === 'ArrowRight' ? 1 : -1)) return;
    moveFocus(code === 'ArrowRight' ? 1 : -1);
    return;
  }
  if (code === 'Enter' || code === 'Space') { activateFocused(); return; }
});

window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => {
  if (state === 'play') pauseGame();
  keys.clear();
});
window.addEventListener('resize', resize);

function moveFocus(dir) {
  if (!ui.items.length) return;
  ui.focus = (ui.focus + dir + ui.items.length) % ui.items.length;
}

function adjustFocused(dir) {
  const it = ui.items[ui.focus];
  if (!it || it.kind !== 'slider') return false;
  it.set(clamp(it.get() + dir * 5, 0, 100));
  return true;
}

function activateFocused() {
  const it = ui.items[ui.focus];
  if (it) activate(it);
}

window.__game = {
  get state() { return state; },
  get wave() { return wave; },
  get score() { return score; },
  get hp() { return player ? player.hp : 0; },
  get pullCd() { return pullCd; },
  get detonateCd() { return detonateCd; },
  get runStats() { return runStats; },
  get lastRun() { return lastRun; },
  get enemies() { return enemies.length; },
  get enemyList() { return enemies; },
  get mines() { return mines; },
  get bossHp() { return boss ? boss.hp : null; },
  get bossPhase() { return boss ? (boss.phase2 ? 2 : 1) : null; },
  get bossState() { return boss; },
  get beams() { return beams.length; },
  get spawnQueue() { return spawnQueue.slice(); },
  get assets() {
    const o = {};
    for (const k in IMG) o[k] = imgReady(IMG[k]);
    return o;
  },
  hitBoss: () => damageBoss(),
  get modifier() { return waveMod ? waveMod.id : null; },
  get style() { return { mult: style, max: styleMax, bonus: styleBonus, t: +styleT.toFixed(2) }; },
  get bossPos() { return boss ? { x: boss.x, y: boss.y } : null; },
  get balance() { return BAL; },
  get balanceSource() { return balanceSource; },
  get audio() {
    return {
      context: ac ? ac.state : null,
      music: musicOn,
      musicGain: musicBus ? +musicBus.gain.value.toFixed(3) : null,
      sfxGain: sfxBus ? +sfxBus.gain.value.toFixed(2) : null
    };
  },
  get player() { return player; },
  get bullet() { return bullet; },
  start: startRun,
  menu: toMenu,
  tick: (dt) => update(dt),
  render: () => draw(),
  end: finishDeath,
  boss: () => {
    resetRun();
    state = 'play';
    wave = 9;
    startWave();
  },
  damage: () => hurt(player.x, player.y - 1),
  killBoss: () => {
    if (!boss) return;
    boss.hp = 1;
    damageBoss();
  }
};

function deepMerge(base, over) {
  if (Array.isArray(over)) return over.slice();
  if (over && typeof over === 'object') {
    const out = Object.assign({}, base);
    for (const key in over) out[key] = deepMerge(base ? base[key] : undefined, over[key]);
    return out;
  }
  return over !== undefined ? over : base;
}

async function loadBalance() {
  if (window.location.protocol === 'file:') {
    BAL = FALLBACK_BALANCE;
    balanceSource = 'built-in';
    return;
  }
  try {
    const res = await fetch('balance.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const merged = deepMerge(FALLBACK_BALANCE, data);
    if (!merged.waves || !Array.isArray(merged.waves.composition) || merged.waves.composition.length < 2) {
      throw new Error('bad waves');
    }
    BAL = merged;
    balanceSource = 'balance.json';
  } catch (e) {
    BAL = FALLBACK_BALANCE;
    balanceSource = 'built-in';
  }
}

resize();
loadBalance().finally(() => {
  BASE_BAL = BAL;
  resetRun();
  window.requestAnimationFrame(frame);
});
})();
</script>
